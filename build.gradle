plugins {
    id 'com.android.application'
}
android {
    namespace 'com.musclerank.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.musclerank.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
base {
    archivesName = "MuscleRank"
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
