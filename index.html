.ru.t5 .ru-rays{background:repeating-conic-gradient(from 0deg,#ff5a7a66 0deg 4deg,transparent 4deg 12deg,#5fc8ff66 12deg 16deg,transparent 16deg 26deg,#fff36b55 26deg 30deg,transparent 30deg 40deg);opacity:.42}
.ru.t6 .ru-rays{opacity:.5;animation-duration:10s}
.ru.t7{background:radial-gradient(circle at 50% 55%,#6e140f 0%,#1c0504 55%,#070101 100%)}
.ru.t7 .ru-rays{opacity:.4;background:repeating-conic-gradient(from 0deg,#ff5a1f88 0deg 6deg,transparent 6deg 18deg)}
.ru.t8{background:radial-gradient(circle at 50% 40%,#0f4a63 0%,#05141c 55%,#020608 100%)}
.ru.t8 .ru-rays{opacity:.55;animation-duration:8s;background:repeating-conic-gradient(from 0deg,#bff0ff88 0deg 3deg,transparent 3deg 12deg)}
.ru.t7.hit .ru-stage,.ru.t8.hit .ru-stage{animation:ruShake .55s cubic-bezier(.36,.07,.19,.97)}
.ru.t6.hit .ru-stage{animation:ruShake .35s cubic-bezier(.36,.07,.19,.97)}
@keyframes ruShake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
.ru.t8.flash::after{background:radial-gradient(circle at 50% 30%,#e6fbff,transparent 70%);animation:ruFlash8 .9s ease-out}
@keyframes ruFlash8{0%{opacity:0}8%{opacity:.85}16%{opacity:.15}24%{opacity:.7}100%{opacity:0}}
.ru.t7.flash::after{background:radial-gradient(circle at 50% 60%,#ff8a5a,transparent 65%)}
.ru.t3 .ru-l b,.ru.t3 .ru-t{background:linear-gradient(100deg,#fff 20%,#ffe58a 45%,#fff 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ruShine 2.4s linear infinite}
/* ===== seviyeye özel rozet koreografisi ===== */
.ru-card.in .ru-k{transition-delay:var(--td,.55s)}
.ru-card.in .ru-t{transition-delay:calc(var(--td,.55s) + .1s)}
.ru-card.in .ru-sub{transition-delay:calc(var(--td,.55s) + .15s)}
.ru-card.in .ru-l{transition-delay:calc(var(--td,.55s) + .23s)}
.ru-card.in .ru-bar,.ru-card.in .ru-meta{transition-delay:calc(var(--td,.55s) + .31s)}
.ru-card.in .ru-n,.ru-card.in .ru-go,.ru-card.in .ru-skip{transition-delay:calc(var(--td,.55s) + .45s)}
.ru-emb{opacity:1!important;transform:none!important;filter:none!important;animation:none!important;perspective:700px}
.ru-e{position:relative;z-index:1;display:grid;place-items:center;opacity:0}
.ru-e>svg,.ru-e>.myth{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--tc) 80%,transparent))}
.ru-card.still .ru-e{opacity:1}
.ru-card.in.hit .ru-e>svg,.ru-card.in.hit .ru-e>.myth{animation:ruFloat 3s ease-in-out 1s infinite}
.ru-card.in .ru-ring{animation:none}
.ru-card.hit .ru-ring{animation:ruRing2 1s ease-out}
.ru-card.hit .ru-ring.r2{animation:ruRing2 1.25s ease-out .14s}
/* varsayılan */
.ru-card.in .ru-e{animation:ruDrop .55s cubic-bezier(.3,1.4,.5,1) .05s forwards}
/* 0 Tahta: yerden filizlenip sallanır */
.ru.t0 .ru-card.in .ru-e{animation:e0 1s cubic-bezier(.2,.9,.3,1.2) forwards;transform-origin:50% 100%}
@keyframes e0{0%{opacity:0;transform:translateY(70px) scale(.3,.1)}45%{opacity:1;transform:translateY(-8px) scale(.9,1.2)}60%{transform:translateY(0) scale(1.1,.88) rotate(0)}72%{transform:scale(1) rotate(-7deg)}84%{transform:rotate(5deg)}100%{opacity:1;transform:none}}
.ru-ground{position:absolute;left:50%;bottom:-6px;width:160px;height:16px;margin-left:-80px;border-radius:50%;background:radial-gradient(ellipse,#7a4a22,transparent 70%);opacity:0}
.ru.t0 .ru-card.in .ru-ground{animation:g0 1s ease-out forwards}
@keyframes g0{0%{opacity:0;transform:scaleX(.2)}40%{opacity:.9;transform:scaleX(1.2)}100%{opacity:.5;transform:scaleX(1)}}
/* 1 Bronz: kızgın metal, üç çekiç darbesiyle dövülür */
.ru.t1 .ru-card.in .ru-e{animation:e1 1.05s linear forwards}
@keyframes e1{0%{opacity:0;transform:scale(.6);filter:brightness(2.6) saturate(2) hue-rotate(-10deg)}
  12%{opacity:1;transform:scale(.95)} 30%{transform:scale(.95)} 33%{transform:scale(1.14,.8)} 40%{transform:scale(.97,1.04)}
  58%{transform:scale(.97);filter:brightness(1.9) saturate(1.6)} 61%{transform:scale(1.14,.8)} 68%{transform:scale(.98,1.03)}
  86%{transform:scale(.98);filter:brightness(1.35)} 89%{transform:scale(1.16,.78)} 96%{transform:scale(1.02)} 100%{opacity:1;transform:none;filter:none}}
.ru-ham{position:absolute;z-index:3;right:-34px;top:-30px;font-size:56px;transform-origin:80% 80%;opacity:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.ru.t1 .ru-card.in .ru-ham{animation:ham 1.05s linear forwards}
@keyframes ham{0%{opacity:0;transform:rotate(40deg)}10%{opacity:1;transform:rotate(40deg)} 28%{transform:rotate(40deg)} 33%{transform:rotate(-25deg)} 45%{transform:rotate(40deg)}
  56%{transform:rotate(40deg)} 61%{transform:rotate(-25deg)} 73%{transform:rotate(40deg)} 84%{transform:rotate(40deg)} 89%{transform:rotate(-28deg)} 95%{opacity:1} 100%{opacity:0;transform:rotate(30deg) translate(40px,-30px)}}
/* 2 Gümüş: 3 tur dönerek parlar */
.ru.t2 .ru-card.in .ru-e{animation:e2 1.1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes e2{0%{opacity:0;transform:rotateY(-1080deg) scale(.4)}25%{opacity:1}100%{opacity:1;transform:rotateY(0) scale(1)}}
.ru-shine{position:absolute;z-index:2;inset:-10px;pointer-events:none;border-radius:20px;opacity:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:250% 100%;mix-blend-mode:overlay;-webkit-mask:radial-gradient(circle,#000 55%,transparent 72%);mask:radial-gradient(circle,#000 55%,transparent 72%)}
.ru-card.in .ru-shine{animation:shine 1s ease-in-out forwards}
.ru.t2 .ru-card.in .ru-shine{animation-delay:1.05s}.ru.t3 .ru-card.in .ru-shine{animation-delay:.75s}.ru.t5 .ru-card.in .ru-shine{animation-delay:.9s}
@keyframes shine{0%{opacity:1;background-position:130% 0}100%{opacity:1;background-position:-130% 0}}
/* 3 Altın: madeni para gibi düşer, döner ve sekerek oturur */
.ru.t3 .ru-card.in .ru-e{animation:e3 .95s cubic-bezier(.4,0,.6,1) forwards}
@keyframes e3{0%{opacity:0;transform:translateY(-55vh) rotateY(0)}10%{opacity:1}62%{transform:translateY(0) rotateY(900deg) scale(1.08,.9)}74%{transform:translateY(-34px) rotateY(1010deg) scale(1)}86%{transform:translateY(0) rotateY(1080deg) scale(1.04,.95)}93%{transform:translateY(-8px)}100%{opacity:1;transform:none}}
.ru-shadow{position:absolute;left:50%;bottom:-8px;width:130px;height:18px;margin-left:-65px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);opacity:0}
.ru.t3 .ru-card.in .ru-shadow{animation:sh3 .95s ease-in forwards}
@keyframes sh3{0%{opacity:0;transform:scale(.2)}62%{opacity:.8;transform:scale(1.1)}74%{opacity:.5;transform:scale(.8)}100%{opacity:.7;transform:scale(1)}}
/* 4 Platin: parçalar birleşir, kristal gibi oluşur */
.ru.t4 .ru-card.in .ru-e{animation:e4 .95s ease-out forwards}
@keyframes e4{0%{opacity:0;clip-path:circle(0% at 50% 50%);filter:brightness(3) blur(4px)}70%{opacity:1;clip-path:circle(30% at 50% 50%);filter:brightness(2.2) blur(1px)}86%{clip-path:circle(75% at 50% 50%);filter:brightness(1.6)}100%{opacity:1;clip-path:circle(75% at 50% 50%);filter:none}}
.ru-hexr{position:absolute;inset:-30px;border:2px solid color-mix(in srgb,var(--tc) 80%,#fff);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:0}
.ru.t4 .ru-card.in .ru-hexr{animation:hx 1.6s ease-out .75s forwards}
@keyframes hx{0%{opacity:.9;transform:scale(.5) rotate(0)}100%{opacity:0;transform:scale(1.9) rotate(60deg)}}
/* 5 Elmas: yüzey yüzey belirir, prizma ışığı */
.ru.t5 .ru-card.in .ru-e{animation:e5 1s ease-out forwards}
@keyframes e5{0%{opacity:1;clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%);filter:hue-rotate(0) brightness(2.5)}
  30%{clip-path:polygon(50% 0,50% 0,50% 100%,50% 100%);filter:hue-rotate(90deg) brightness(2)}
  60%{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);filter:hue-rotate(200deg) brightness(1.7)}
  85%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);filter:hue-rotate(320deg) brightness(1.3)}
  100%{opacity:1;clip-path:polygon(-20% -20%,120% -20%,120% 120%,-20% 120%);filter:none}}
.ru-prism{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;opacity:0;pointer-events:none;
  background:conic-gradient(from 0deg,#ff5a7a55,#ffb34755,#fff36b55,#5fe08f55,#5fc8ff55,#8f8cf555,#e07ae655,#ff5a7a55);-webkit-mask:radial-gradient(circle,transparent 25%,#000 32%,transparent 70%);mask:radial-gradient(circle,transparent 25%,#000 32%,transparent 70%)}
.ru.t5 .ru-card.in .ru-prism{animation:prism 4s linear .8s infinite}
@keyframes prism{0%{opacity:0;transform:rotate(0)}15%{opacity:1}100%{opacity:1;transform:rotate(360deg)}}
/* 6 Şampiyon: kanatlar açılır */
.ru.t6 .ru-card.in .ru-e{animation:e6 .9s cubic-bezier(.3,1.3,.5,1) .15s forwards}
@keyframes e6{0%{opacity:0;transform:translateY(40px) scale(.5)}100%{opacity:1;transform:none}}
.ru-emb>.ru-wing{position:absolute;z-index:0;top:20px;width:120px;height:90px;fill:color-mix(in srgb,var(--tc) 85%,#fff);opacity:0;filter:drop-shadow(0 0 12px var(--tc))}
.ru-wing.wl{right:62%;transform-origin:100% 80%}
.ru-wing.wr{left:62%;transform-origin:0% 80%}
.ru.t6 .ru-card.in .ru-wing.wl{animation:wl 1s cubic-bezier(.2,1.4,.4,1) .45s forwards}
.ru.t6 .ru-card.in .ru-wing.wr{animation:wr 1s cubic-bezier(.2,1.4,.4,1) .45s forwards}
@keyframes wl{0%{opacity:0;transform:rotate(70deg) scale(.2)}100%{opacity:.95;transform:rotate(0) scale(1)}}
@keyframes wr{0%{opacity:0;transform:rotate(-70deg) scale(.2)}100%{opacity:.95;transform:rotate(0) scale(1)}}
.ru.t6 .ru-card.hit .ru-wing.wl{animation:wl 1s cubic-bezier(.2,1.4,.4,1) .45s forwards,flapL 2.4s ease-in-out 1.5s infinite}
.ru.t6 .ru-card.hit .ru-wing.wr{animation:wr 1s cubic-bezier(.2,1.4,.4,1) .45s forwards,flapR 2.4s ease-in-out 1.5s infinite}
@keyframes flapL{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
/* 7 Titan: karanlıkta çatlar, titrer ve patlar */
.ru.t7 .ru-card.in .ru-e{animation:e7 1.05s linear forwards}
@keyframes e7{0%{opacity:0;filter:brightness(.15)}10%{opacity:1;filter:brightness(.15)}
  20%{transform:translate(-1px,0)}30%{transform:translate(2px,-1px)}40%{transform:translate(-2px,1px)}50%{transform:translate(3px,0);filter:brightness(.35)}
  60%{transform:translate(-4px,2px)}70%{transform:translate(4px,-2px);filter:brightness(.5)}80%{transform:translate(-5px,1px) scale(1.03)}90%{transform:translate(5px,-1px) scale(1.06);filter:brightness(.7)}
  95%{transform:scale(1.25);filter:brightness(2.5)}100%{opacity:1;transform:none;filter:none}}
.ru-crack{position:absolute;z-index:2;width:150px;height:150px;opacity:0;pointer-events:none}
.ru-crack path{fill:none;stroke:#ffb27a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #ff5a1f) drop-shadow(0 0 10px #e2463e);stroke-dasharray:260;stroke-dashoffset:260}
.ru.t7 .ru-card.in .ru-crack{animation:ck 1.25s linear forwards}
.ru.t7 .ru-card.in .ru-crack path{animation:ckp .95s ease-in .1s forwards}
@keyframes ck{0%,80%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@keyframes ckp{to{stroke-dashoffset:0}}
/* 8 Olimpos: karanlık, yıldırım çarpar, rozet ışıkla belirir */
.ru-dark{position:absolute;left:50%;top:50%;width:320vmax;height:320vmax;transform:translate(-50%,-50%);z-index:-1;background:#000;opacity:0;pointer-events:none}
.ru.t8 .ru-card.in .ru-dark{animation:dk 1s ease-out forwards}
@keyframes dk{0%{opacity:0}20%{opacity:.85}68%{opacity:.85}100%{opacity:0}}
.ru.t8 .ru-card.in .ru-e{animation:e8 .9s steps(1) forwards}
.ru.t8 .ru-card.hit .ru-e{animation:e8b .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes e8{0%,100%{opacity:0}}
@keyframes e8b{0%{opacity:1;transform:scale(1.5);filter:brightness(4) drop-shadow(0 0 40px #bff0ff)}100%{opacity:1;transform:none;filter:none}}
/* ===== genel kalite cilası ===== */
:root{--r-card:18px;--shadow-1:0 1px 2px rgba(16,18,27,.04),0 6px 20px rgba(16,18,27,.06);--shadow-2:0 2px 6px rgba(16,18,27,.06),0 18px 40px rgba(16,18,27,.10)}
html{scroll-behavior:smooth}
.panel{border-radius:var(--r-card);box-shadow:var(--shadow-1);border:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.h2{letter-spacing:.2px}
.btn{transition:transform .12s ease,filter .15s ease,background .2s ease;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.go{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 32%,transparent);font-weight:800;letter-spacing:.2px}
.btn:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}
.chip{transition:background .2s,color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.top{backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent)}
.tabbar{backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);background:color-mix(in srgb,var(--surface) 86%,transparent);box-shadow:0 -6px 24px rgba(0,0,0,.06)}
.tabbar a{position:relative;transition:color .2s}
.tabbar a::before{content:"";position:absolute;top:4px;left:50%;width:46px;height:30px;margin-left:-23px;border-radius:999px;background:color-mix(in srgb,var(--red) 14%,transparent);transform:scale(.4);opacity:0;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.tabbar a[aria-current="page"]::before{transform:scale(1);opacity:1}
.tabbar a svg{position:relative;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tabbar a[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
#view.enter>*{animation:pageIn .38s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(4){animation-delay:.12s}#view.enter>*:nth-child(5){animation-delay:.16s}#view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.exrow .ex,.lk-res,.fr,.sg{transition:background .15s,transform .12s}
.exrow .ex:active,.lk-res:active{transform:scale(.99);background:var(--surface-2)}
.item{box-shadow:var(--shadow-1)}
.mapcard{border-radius:var(--r-card);box-shadow:0 10px 30px rgba(0,0,0,.18)}
/* ana sayfa üst bölüm */
.hh{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 12px}
.hh small{display:block;color:var(--muted);font-size:13px;text-transform:capitalize}
.hh h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0;line-height:1.05}
.mr-hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;margin-bottom:12px;color:#fff;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--tc) 38%,#14141f) 0%,#14141f 55%),#14141f;box-shadow:0 14px 34px color-mix(in srgb,var(--tc) 24%,rgba(0,0,0,.25))}
.mrh-glow{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 55%,transparent),transparent 65%);animation:mrhPulse 4s ease-in-out infinite;pointer-events:none}
@keyframes mrhPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
.mrh-top{position:relative;display:flex;align-items:center;gap:14px}
.mrh-top .myth{animation:ruFloat 3.4s ease-in-out infinite}
.mrh-t{flex:1;min-width:0}
.mrh-t small{display:block;font-size:11px;letter-spacing:2.5px;font-weight:800;color:color-mix(in srgb,var(--tc) 70%,#fff)}
.mrh-t b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1.02;color:#fff;text-shadow:0 0 22px color-mix(in srgb,var(--tc) 60%,transparent)}
.mrh-t em{font-style:normal;font-size:13px;color:#c9c9d6}
.mrh-sc{text-align:right}
.mrh-sc b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--tc) 55%,#fff)}
.mrh-sc small{font-size:11px;color:#a9a9ba}
.mrh-bar{position:relative;height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:14px 0 4px}
.mrh-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 55%,#fff),var(--tc));box-shadow:0 0 12px var(--tc)}
.mrh-next{display:flex;justify-content:space-between;font-size:11.5px;color:#a9a9ba}

.mrh-f a{color:#fff;font-weight:700;text-decoration:none}
.hstats{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.hs{background:var(--surface);border-radius:16px;padding:10px 8px;text-align:center;box-shadow:var(--shadow-1);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:86px}
.hs b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.hs span{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.2}
.hs.ring svg{display:block}
.nextw{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-radius:18px;padding:16px;margin-bottom:14px;color:var(--accent-ink);text-decoration:none;
  background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#ff9a3c));box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .12s}
.nextw:active{transform:scale(.98)}
.nextw small{display:block;font-size:11px;letter-spacing:1.5px;font-weight:800;opacity:.75}
.nextw b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.nextw em{display:block;font-style:normal;font-size:12.5px;opacity:.8}

(async()=>{
  try{
    if(DEMO || !window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const col = db.collection('data/users/'+uid);
    const snap = await col.get();
    COL = col;
    const remote = {}; let meta = null;
    snap.docs.forEach(d=>{ if(!d.exists) return; const v=d.data(); if(d.id==='meta') meta=v; else if(d.id.startsWith('w_')) remote[v.id]=v; });
    const local = Object.fromEntries(S.workouts.map(w=>[w.id,w]));
    for(const id in local) if(!remote[id]) pushWorkout(local[id]);
    const all = Object.assign({}, remote, local);
    S.workouts = Object.values(all).map(w=>JSON.parse(JSON.stringify(w))).sort((a,b)=>b.start-a.start);
    if(meta){
      if(meta.name && S.name==='Sporcu') S.name = meta.name;
      if(meta.bw && !S.bw) S.bw = meta.bw;
      ['height','exp','goal','days','place','theme','program','onbDone','account','expStart','age','sex','act','colors','wdays','dur','brk','splitKey'].forEach(k=>{ if(meta[k]!=null && (S[k]==null || S[k]===false)) S[k] = JSON.parse(JSON.stringify(meta[k])); });
      if(meta.food && !Object.keys(S.food||{}).length) S.food = meta.food;
      if(meta.customFoods && meta.customFoods.length && !(S.customFoods||[]).length) S.customFoods = meta.customFoods;
      if(meta.routines && meta.routines.length && !(S.routines&&S.routines.length)) S.routines = meta.routines;
      if(meta.folders && meta.folders.length && !(S.folders&&S.folders.length)) S.folders = meta.folders;
      applyTheme(); if(!S.onbDone && document.getElementById('onb')) {} 
      if(!S.active && meta.active) S.active = JSON.parse(JSON.stringify(meta.active));
    }
    saveLocal(); pushMeta(); render();
  }catch(e){ COL = null; }
})();

function fmtClock(ms){ const t=Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60); }
function fmtDur(sec){ const h=Math.floor(sec/3600), m=Math.round(sec%3600/60); return h? `${h} sa ${m} dk` : `${m} dk`; }
const mNames = ks=>ks.map(k=>MK[k].n).join(', ');

function commOf(id){ if(SL_COMM[id]) return SL_COMM[id]; const d=SL_DER[id]; if(d && SL_COMM[d[0]]) return SL_COMM[d[0]].map(v=>v*d[1]); return null; }
function anchorsOf(id, ef){
  if(ef==null) ef = expF();
  const bw = bwOf(), key = id+'|'+bw+'|'+ef;
  if(ANCH[key]) return ANCH[key];
  const s = stdOf(id); let A;
  const cm = s.t==='w' && !SL[id] ? commOf(id) : null;
  if(SL[id]) A = slRow(SL[id], bw);
  else if(cm){ const sc = bwScale(bw); A = cm.map(v=>v*sc); }
  else if(s.t==='w'){ const sc = bwScale(bw), sh = ISO_RE.test((EXM[id]||{n:''}).n) ? SHAPE_I : SHAPE_C; A = sh.map(x=>x*s.v*sc); }
  else if(s.t==='b' && SL_B[id]) A = SL_B[id].slice();
  else A = SHAPE_B.map(x=>x*s.v);
  if(s.t==='b' && BEASY[id]) A = A.map(v=>v*BEASY[id]);
  if(s.t==='w') A = A.map(v=>v*DIFF);
  A = A.map(v=>v*ef);

function metricOf(id, kg, reps){
  const s = stdOf(id); kg = +kg||0; reps = +reps||0;
  if(reps<=0) return 0;
  if(s.t==='w') return reps<=1 ? kg : kg*(1+Math.min(reps,30)/30);
  if(s.t==='b'){ const bw = bwOf(); return 30*((bw+kg)/bw*(1+Math.min(reps,80)/30)-1); }
  return reps;
}
function idxOfMetric(id, m, ef){
  if(!(m>0)) return -1;
  const P = anchorsOf(id, ef);
  if(m>=P[8]) return TOP;
  let j=0; while(j<7 && m>=P[j+1]) j++;
  return Math.min(TOP, j*DV + DV*(m-P[j])/(P[j+1]-P[j]));
}
function metricOfIdx(id, i, ef){
  const P = anchorsOf(id, ef); i = Math.max(0, Math.min(TOP, i));

const setIdx = (id, st, t) => idxOfMetric(id, metricOf(id, st.kg, st.reps), t!=null ? expFAt(t) : expF());

function scoreAt(v){ if(!(v>=0)) return 0; v = Math.min(TOP, v); return Math.max(1, Math.round(v < DV ? 1 + 198*v/DV : 200 + 100*(v-DV)/DV)); }

function needFor(id, i){

function bestByEx(workouts){
  const best = {};

    const idx = setIdx(it.exId, st, w.start);

function planData(scope){
  const rows = ex => ex.filter(x=>EXM[x.id]).map(x=>({n:EXM[x.id].n, sets:x.sets, reps:x.reps, rest:x.rest, kg:suggestKg(x.id, x.reps), unit: stdOf(x.id).t==='t'&&SECS.has(x.id)?'sn':''}));
  if(scope==='prog' && S.program){ const P=S.program, g=GOALS[P.goal]||GOALS.kas; return {title:'Antrenman programım', sub:`${P.days.length} günlük ${P.split} programı, hedef: ${g[0].toLocaleLowerCase('tr')}, ${P.place==='ev'?'evde':'salonda'}`, days:P.days.map(d=>({name:d.name, ex:rows(d.ex)}))}; }
  const R = S.routines||[];
  if(scope.startsWith('rt:')){ const r = R.find(x=>x.id===scope.slice(3)); if(!r) return null; return {title:r.name, sub:'Kendi antrenmanım', days:[{name:r.name, ex:rows(r.ex)}]}; }
  if(scope.startsWith('f:')){ const f = (S.folders||[]).find(x=>x.id===scope.slice(2)); if(!f) return null; const list = R.filter(r=>r.folder===f.id); if(!list.length) return null; return {title:f.name, sub:`${list.length} antrenman`, days:list.map(r=>({name:r.name, ex:rows(r.ex)}))}; }
  if(scope==='all' && R.length){ return {title:'Antrenmanlarım', sub:`${R.length} antrenman`, days:R.map(r=>({name:r.name, ex:rows(r.ex)}))}; }
  return null;

function loadJsPDF(){ return new Promise((res,rej)=>{ if(window.jspdf) return res(window.jspdf.jsPDF); const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; sc.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej(new Error('PDF kütüphanesi yüklenemedi')); sc.onerror=()=>rej(new Error('PDF kütüphanesi yüklenemedi')); document.head.appendChild(sc); }); }
async function buildPdf(P){
  const JsPDF = await loadJsPDF();
  const W=1240, H=1754, M=90, pages=[]; let cv, x, y;
  const F = (w,sz)=>`${w} ${sz}px Arial, Helvetica, sans-serif`;
  const fit = (t,max)=>{ if(x.measureText(t).width<=max) return t; while(t.length>1 && x.measureText(t+'…').width>max) t=t.slice(0,-1); return t+'…'; };
  const newPage = ()=>{ cv=document.createElement('canvas'); cv.width=W; cv.height=H; x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,W,H);
    x.fillStyle='#e5322d'; x.beginPath(); x.arc(M+12,M+12,12,0,Math.PI*2); x.fill(); x.fillStyle='#1b2030'; x.font=F(700,32); x.fillText('MuscleRank', M+34, M+24);
    x.fillStyle='#8a90a0'; x.font=F(400,20); x.textAlign='right'; x.fillText(new Date().toLocaleDateString('tr-TR'), W-M, M+22); x.textAlign='left';
    x.strokeStyle='#e3e5ea'; x.lineWidth=2; x.beginPath(); x.moveTo(M,M+46); x.lineTo(W-M,M+46); x.stroke(); y=M+86; pages.push(cv); };
  const need = h=>{ if(y+h>H-M-40){ newPage(); return true; } return false; };
  newPage();
  x.fillStyle='#1b2030'; x.font=F(700,46); x.fillText(fit(P.title,W-2*M), M, y+20); y+=56;
  x.fillStyle='#5b6377'; x.font=F(400,24); x.fillText(fit(P.sub,W-2*M), M, y+12); y+=46;
  const cols=[M+16, M+600, M+800, M+930];
  P.days.forEach(d=>{
    need(170);
    const head = (cont)=>{ x.fillStyle='#1b2030'; x.fillRect(M,y,W-2*M,54); x.fillStyle='#fff'; x.font=F(700,26); x.fillText(fit(d.name+(cont?' (devam)':''),W-2*M-40), M+16, y+36); y+=54;
      x.fillStyle='#f1f2f5'; x.fillRect(M,y,W-2*M,40); x.fillStyle='#5b6377'; x.font=F(700,18);
      ['HAREKET','SET × TEKRAR','DİNLENME','ÖNERİLEN'].forEach((t,i)=>x.fillText(t, cols[i], y+27)); y+=40; };
    head(false);
    d.ex.forEach((r,i)=>{
      if(need(48)) head(true);
      if(i%2){ x.fillStyle='#fafafb'; x.fillRect(M,y,W-2*M,48); }
      x.fillStyle='#1b2030'; x.font=F(600,22); x.fillText(fit(r.n,560), cols[0], y+32);
      x.font=F(400,22); x.fillText(`${r.sets} × ${r.reps}${r.unit?' '+r.unit:''}`, cols[1], y+32); x.fillText(`${r.rest} sn`, cols[2], y+32); x.fillText(r.kg?`~${fmtKg(r.kg)} kg`:'–', cols[3], y+32);
      x.strokeStyle='#eceef2'; x.lineWidth=1; x.beginPath(); x.moveTo(M,y+48); x.lineTo(W-M,y+48); x.stroke(); y+=48;
    });
    y+=34;
  });
  pages.forEach((pg,i)=>{ const c=pg.getContext('2d'); c.fillStyle='#8a90a0'; c.font=F(400,18); c.textAlign='center'; c.fillText(`${i+1} / ${pages.length}  ·  Önerilen kilolar tahminidir; rahat geliyorsa artır, zorlanıyorsan azalt.`, W/2, H-50); });
  const pdf = new JsPDF({unit:'mm', format:'a4', compress:true});
  pages.forEach((pg,i)=>{ if(i) pdf.addPage(); pdf.addImage(pg.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297); });
  return pdf.output('arraybuffer');
}
/* claude.ai dışında (APK, kendi siten) dosyayı tarayıcının kendi indirmesiyle kaydet */
function blobDownloader(){ return {save: async ({filename, data})=>{
  if(window.Android && window.Android.saveFile){ /* Android uygulaması: dosyayı telefonun İndirilenler klasörüne yaz */
    let b64; if(typeof data==='string') b64 = btoa(unescape(encodeURIComponent(data))); else { const u = new Uint8Array(data); let bin=''; for(let i=0;i<u.length;i+=0x8000) bin += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); b64 = btoa(bin); }
    window.Android.saveFile(filename, b64, /\.pdf$/.test(filename)?'application/pdf':/\.csv$/.test(filename)?'text/csv':/\.json$/.test(filename)?'application/json':'text/plain'); return; }
  const mime = /\.pdf$/.test(filename)?'application/pdf':/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.json$/.test(filename)?'application/json':'text/plain;charset=utf-8';
  const url = URL.createObjectURL(new Blob([data], {type:mime})); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 2000); }}; }
async function getDownloader(){ try{ if(window.claude && window.claude.use) return await window.claude.use('downloads'); }catch(e){} return blobDownloader(); }
async function exportPlan(scope, fmt){
  const P = planData(scope); if(!P) return;
  const dl = await getDownloader();
  const base = 'musclerank-' + (slug(P.title)||'program');
  let filename, data;
  try{
    if(fmt==='csv'){
      const q = v=>`"${String(v??'').replace(/"/g,'""')}"`;
      const lines = [['Gün / Antrenman','Hareket','Set','Tekrar','Dinlenme (sn)','Önerilen kg'].map(q).join(';')];
      P.days.forEach(d=>d.ex.forEach(r=>lines.push([d.name, r.n, r.sets, r.reps+(r.unit?' '+r.unit:''), r.rest, r.kg?String(r.kg).replace('.',','):''].map(q).join(';'))));
      filename = base+'.csv'; data = '\ufeff'+lines.join('\r\n');
    } else if(fmt==='txt'){
      let t = `MUSCLERANK: ${P.title}\n${P.sub}\n${'='.repeat(40)}\n`;
      P.days.forEach(d=>{ t += `\n${d.name}\n${'-'.repeat(d.name.length)}\n`; d.ex.forEach((r,i)=>{ t += `${i+1}. ${r.n}: ${r.sets} × ${r.reps}${r.unit?' '+r.unit:''}, dinlenme ${r.rest} sn${r.kg?`, önerilen ~${fmtKg(r.kg)} kg`:''}\n`; }); });
      filename = base+'.txt'; data = t;
    } else {
      modal('<h2>PDF hazırlanıyor…</h2><p class="sub">Birkaç saniye sürebilir.</p>',[]);
      data = await buildPdf(P); filename = base+'.pdf'; $('#modal').hidden = true;
    }
    await dl.save({filename, data});
  }catch(e){
    $('#modal').hidden = true;
    if(e && e.code==='declined') return;
    modal(`<h2>İndirilemedi</h2><p class="sub">${esc((e && e.message) || 'Bilinmeyen bir hata oluştu.')}</p>`,[{label:'Tamam'}]);
  }
}

const fatLevel = x => x<0.5 ? 0 : x<2 ? 1 : x<4 ? 2 : 3;
/* toparlanma süreleri (saat): sırt 72, göğüs 48, omuz 48, triceps 48, biceps ve bilek 24, bacak 72 */
const REC_H = {rh:72,tr:72,os:72,bel:72,lat:72, ug:48,ag:48, on:48,yan:48,arka:48, tri:48, bic:24,bilek:24, quad:72,ham:72,kalf:72};
function fatigueOf(){
  const now = Date.now(), f = {}, left = {};
  const add = (items, t)=>{
    const h = Math.max(0, (now-t)/36e5);
    (items||[]).forEach(it=>{
      const x = EXM[it.exId], n = (it.sets||[]).length; if(!x || !n) return;
      const part = (k,w)=>{ const need = REC_H[k] || Math.min(72, 24 + 8*n*w); if(h>=need) return; f[k]=(f[k]||0) + n*w*(1-h/need); left[k]=Math.max(left[k]||0, need-h); };
      x.p.forEach(k=>part(k,1)); x.s.forEach(k=>part(k,0.5));
    });
  };
  S.workouts.forEach(w=>add(w.items, w.end||w.start));
  if(S.active) add(S.active.items, now);
  return {f, left};
}

function cloneFig(view, sfx){
  const src = document.querySelector(`#figs .fig-${view}`), c = src.cloneNode(true);

  c.querySelectorAll('[id]').forEach(n=>{ const nn = n.id+'-'+sfx; ids.set(n.id, nn); n.id = nn; });
  c.querySelectorAll('*').forEach(n=>{ for(const a of ['fill','stroke','filter','clip-path','mask']){ const v=n.getAttribute(a); if(v && v.startsWith('url(#')){ const id=v.slice(5,-1); if(ids.has(id)) n.setAttribute(a, `url(#${ids.get(id)})`); } } });
  c.querySelectorAll('.m').forEach(p=>p.removeAttribute('style'));
  return c;
}
function gradFor(svg, sfx, col){

    const NS='http://www.w3.org/2000/svg', g=document.createElementNS(NS,'radialGradient');
    g.setAttribute('id',id); g.setAttribute('cx','44%'); g.setAttribute('cy','36%'); g.setAttribute('r','72%');
    [[0,rgb(mix(hex(col),[255,255,255],.45))],[.5,col],[1,rgb(mix(hex(col),[0,0,0],.45))]].forEach(([o,cc])=>{ const st=document.createElementNS(NS,'stop'); st.setAttribute('offset',o); st.setAttribute('stop-color',cc); g.appendChild(st); });
    svg.querySelector('defs').appendChild(g);
  }
  return id;
}

function topPct(idx){
  /* Liftoff’a göre tahmini yüzdelik: kullanıcının Liftoff’taki Champion III sonucu “en iyi %10,6” idi */
  const P=[0,10,25,45,62,76,83,91,98].map((v,i)=>[i*DV, v]).concat([[TOP+DV, 99.9]]);

function lineChart(pts, fmtY, steps){

function lookupCell(id, i, reps){

function programNotes(exp, goal, days){
  const n = [];

  n.push('Her antrenmana 5–10 dakika hafif kardiyo ile ısın; ilk harekette 1–2 hafif ısınma seti yap.');
  n.push('İlerleme kuralı: bütün setlerde tekrar aralığının üst sınırını 1–2 tekrar geçince kiloyu %2–10 artır (küçük kaslarda %2–5, bacaklarda %5–10).');
  if(exp<=1) n.push('İlk 2–3 hafta hafif kilolarla tekniği öğren; set sonunda 2–3 tekrar daha yapabilecek gibi bitir.');
  n.push('Aynı kası iki ağır antrenman arasında en az 48 saat dinlendir; uyku ve protein toparlanmanın yarısıdır.');
  if(goal==='yag') n.push('Yağ yakmada asıl farkı kalori açığı yapar; Beslenme sekmesindeki hedefe uy, antrenmanda kilolarını korumaya çalış.');
  if(goal==='kas') n.push('Kas yapmak için hafif kalori fazlası ve yeterli protein gerekir; Beslenme sekmesindeki hedefleri takip et.');
  if(goal==='guc') n.push('Ağır setlerde 2–3 dakika dinlen; tekniğin bozulduğu seti bitir, zorlama.');
  return n;
}
function genProgram(seed, splitKey){
  const exp0 = Math.max(0, +(S.exp??2) - (S.brk?1:0));
  let days = Math.min(6, Math.max(2, +S.days||3)); days = progDays(exp0, days);
  const place = S.place==='ev' ? 'ev' : 'salon', goal = S.goal||'kas', exp = exp0;
  const opts = SPLIT_OPTS[days], sp = opts.find(o=>o.k===(splitKey||S.splitKey)) || splitOptsFor(days, exp)[0];
  /* seçilen günler programdan fazlaysa günleri haftaya eşit yay (ör. 5 günden 3’ü: Pzt, Çar, Cum) */
  const wdAll = (S.wdays||[]).slice().sort((a,b)=>a-b);
  const wd = wdAll.length<=days ? wdAll : Array.from({length:days},(_,k)=>wdAll[Math.round(k*(wdAll.length-1)/Math.max(1,days-1))]);
  const dayName = (di, n) => wd.length===days ? `${WD_LONG[wd[di]]}: ${n}` : `${di+1}. gün: ${n}`;
  const durMax = (DUR_OPTS.find(x=>x[0]===+S.dur)||DUR_OPTS[1])[2];
  const fin = P => Object.assign(P, {splitKey: sp.k, freq: sp.f, wdays: wd, rest: wd.length===days ? WD_LONG.filter((_,i)=>!wd.includes(i)) : []});
  if(exp===0 && sp.k.startsWith('fb')){
    const codes = days===2 ? ['BA','BB'] : ['BA','BB','BA'];
    const out = codes.map((code,di)=>{ const [name, slots] = BEG_DAYS[code]; const ex=[], seen=new Set();
      slots.forEach(slot=>{ const pool=((BEG_SLOTS[slot]||SLOTS[slot])[place]||SLOTS[slot].salon).filter(id=>EXM[id]); if(!pool.length) return; let id = pool[(seed||0) % pool.length]; if(seen.has(id)) id = pool.find(x=>!seen.has(x)); if(!id) return; seen.add(id);
        const comp = COMPOUND.has(slot);
        ex.push(slot==='karin' ? {id, sets:3, reps: stdOf(id).t==='t'&&SECS.has(id)?'20-40':'12-15', rest:60} : {id, sets: comp?3:2, reps: goal==='yag'?'12-15':'8-12', rest: comp?90:60}); });
      if(goal==='yag'){ const kid = SLOTS.kardiyo[place][di % SLOTS.kardiyo[place].length]; if(EXM[kid]) ex.push({id:kid, ...scheme('kardiyo', goal, exp)}); }
      return {name: dayName(di, name), ex: ex.slice(0, Math.max(4, durMax+1))}; });
    return fin({created: Date.now(), seed: seed||0, days: out, next: 0, split: 'Yeni başlayan tüm vücut (A/B)', goal, place, notes: programNotes(exp, goal, days)});
  }
  const maxEx = Math.min(durMax, [5,6,7,7,7][exp]);
  const used = {}; seed = seed||0;
  const out = sp.codes.map((code, di)=>{
    const [name, slots] = DAYT[code]; const ex = []; const seen = new Set();
    slots.slice(0, maxEx).forEach(slot=>{
      const pool = (SLOTS[slot][place]||SLOTS[slot].salon).filter(id=>EXM[id]);
      let k = (used[slot]||0) + seed, id = pool[k % pool.length], tries = 0;
      while(seen.has(id) && tries<pool.length){ k++; id = pool[k % pool.length]; tries++; }
      used[slot] = (used[slot]||0) + 1; if(seen.has(id)) return; seen.add(id);
      const sc = scheme(slot, goal, exp); ex.push({id, ...sc});
    });
    if(goal==='yag'){ const pool = SLOTS.kardiyo[place]; const id = pool[di % pool.length]; if(EXM[id] && !seen.has(id)) ex.push({id, ...scheme('kardiyo', goal, exp)}); }
    return {name: dayName(di, name), ex};
  });
  return fin({created: Date.now(), seed, days: out, next: 0, split: sp.n, goal, place, notes: programNotes(exp, goal, days)});
}
const START_IDX = [4, 6, 8, 11, 12];
const COMPOUND_EX = id => !ISO_RE.test((EXM[id]||{n:''}).n);
function suggestKg(id, reps){
  if(stdOf(id).t!=='w') return null;
  const hi = parseInt(String(reps).split('-').pop()) || 10;
  const best = bestByEx(S.workouts)[id];
  const e1 = best && best.idx>=0 ? metricOf(id, best.kg, best.reps) : metricOfIdx(id, START_IDX[+(S.exp??2)]);
  const kg = e1/(1+hi/30)*0.92;
  return kg>0 ? Math.max(0.5, Math.round(kg*2)/2) : null;
}

const hx2 = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
const toHx = a => '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixHx = (a,b,t) => { const A=hx2(a), B=hx2(b); return toHx(A.map((v,i)=>v+(B[i]-v)*t)); };

function applyColors(){
  const mode = isDark() ? 'dark' : 'light', c = ((S.colors||{})[mode])||{}, st = document.documentElement.style;
  ['--bg','--surface','--surface-2','--line','--ink','--muted'].forEach(v=>st.removeProperty(v));
  const bg = c.bg; let ink = c.text;
  if(bg){ const dk = lumHx(bg) < .2;
    st.setProperty('--bg', bg);
    st.setProperty('--surface', dk ? mixHx(bg,'#ffffff',.07) : mixHx(bg,'#ffffff',.78));
    st.setProperty('--surface-2', dk ? mixHx(bg,'#ffffff',.12) : mixHx(bg,'#ffffff',.42));
    st.setProperty('--line', dk ? mixHx(bg,'#ffffff',.18) : mixHx(bg,'#000000',.08));
    if(!ink && dk !== (mode==='dark')) ink = dk ? '#eceff5' : '#1b2030';
  }
  if(ink){ const base = bg || (mode==='dark' ? '#141824' : '#eceef2'); st.setProperty('--ink', ink); st.setProperty('--muted', mixHx(ink, base, .38)); }
}

  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); src.buffer = buf; f.type='lowpass'; f.frequency.value = freq; g.gain.value = vol; src.connect(f); f.connect(g); g.connect(AC.destination); src.start(AC.currentTime+t0); }catch(e){} }
function tierSound(ti, big){
  if(S.sound===false) return; try{ unlockAudio(); if(!AC) return; }catch(e){ return; }
  const arp = (notes, gap, type) => notes.forEach((f,i)=>tone(f, .05+i*gap, i===notes.length-1?.8:.28, type, .16));
  if(ti===0){ tone(140,0,.18,'triangle',.3); noise(0,.12,900,.25); arp([392,523],.1); }
  else if(ti===1){ tone(1250,0,.9,'sine',.12); tone(1870,0,.6,'sine',.06); noise(0,.06,5000,.2); arp([523,659,784],.09); }
  else if(ti===2){ [1568,2093,2637,3136].forEach((f,i)=>tone(f,.02+i*.07,.5,'sine',.06)); arp([587,740,880],.09); }
  else if(ti===3){ for(let i=0;i<6;i++) tone(2400+Math.random()*900,.05+i*.06,.25,'triangle',.05); arp([523,659,784,1047],.09); }
  else if(ti===4){ tone(880,0,1.2,'sine',.08); tone(1320,.05,1.2,'sine',.05); arp([659,831,988,1319],.08); }
  else if(ti===5){ [2093,2637,3136,4186].forEach((f,i)=>tone(f,i*.05,.9,'sine',.05)); arp([698,880,1047,1397],.08,'triangle'); }
  else if(ti===6){ [0,.25,.5].forEach(t=>{ noise(t,.35,2600,.35); }); arp([523,659,784,1047,1319],.085,'triangle'); }
  else if(ti===7){ tone(55,0,1.1,'sawtooth',.18); noise(0,.9,400,.6); arp([392,523,622,784,1047],.1,'sawtooth'); }
  else { noise(0,1.6,700,.9); noise(.05,.25,6000,.4); tone(70,0,1.4,'sawtooth',.16); arp([523,659,784,1047,1319,1568],.09,'triangle'); }
}

const defRest = id => S.restDefault ? +S.restDefault : stdOf(id).t==='t' ? 60 : COMPOUND_EX(id) ? 120 : 75;
function restOf(it){ if(!it) return 90; if(it.plan && it.plan.rest!=null) return +it.plan.rest; const p = (S.restPref||{})[it.exId]; return p!=null ? +p : defRest(it.exId); }
const fmtRest = sec => sec>=60 ? `${Math.floor(sec/60)}:${pad(sec%60)} dk` : `${sec} sn`;
let AC = null;
function unlockAudio(){ try{ if(!AC){ const C = window.AudioContext||window.webkitAudioContext; if(C) AC = new C(); } if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(){ if(S.sound===false) return; try{ if(!AC) return; [0,0.22,0.44].forEach((t,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value = i===2?1046:880; g.gain.setValueAtTime(0.0001, AC.currentTime+t); g.gain.exponentialRampToValueAtTime(0.25, AC.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+t+0.18); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+0.2); }); }catch(e){} }
function startRest(id){
  const it = S.active && S.active.items.find(i=>i.exId===id); const sec = restOf(it);
  if(it && it.ss){ const its = S.active.items, pos = its.indexOf(it); if(its[pos+1] && its[pos+1].ss===it.ss){ S.active.rest = null; ui.sel = its[pos+1].exId; return; } }
  if(!(sec>0)) { if(S.active) S.active.rest = null; return; }
  S.active.rest = {ex:id, end: Date.now()+sec*1000, total: sec, done:false};
}
function renderRest(){
  let el = document.getElementById('restbar');
  const R = S.active && S.active.rest;
  if(!R){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'restbar'; el.setAttribute('role','timer'); document.body.appendChild(el); }
  const left = Math.ceil((R.end - Date.now())/1000);
  if(left<=0 && !R.done){ R.done = true; R.doneAt = Date.now(); try{ if(S.vibe!==false) navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} beep(); save(); }
  if(R.done && Date.now()-R.doneAt > 5000){ S.active.rest = null; el.remove(); return; }
  const name = EXM[R.ex] ? EXM[R.ex].n : '';
  const pct = R.done ? 100 : Math.min(100, Math.max(0, (1 - left/R.total)*100));
  const mm = Math.max(0,left);
  const html = R.done
    ? `<div class="rb-in done"><div class="rb-t"><small>Dinlenme bitti</small><b>Sıradaki sete geç 💪</b></div><button class="rb-x" data-act="rest-skip" aria-label="Kapat">×</button></div><div class="rb-bar"><i style="width:100%"></i></div>`
    : `<div class="rb-in"><div class="rb-t"><small>Dinlenme: ${esc(name)}</small><b class="rb-time">${Math.floor(mm/60)}:${pad(mm%60)}</b></div>
       <div class="rb-btns"><button data-act="rest-plus" data-d="-15">−15</button><button data-act="rest-plus" data-d="15">+15</button><button class="rb-skip" data-act="rest-skip">Geç</button></div></div>
       <div class="rb-bar"><i style="width:${pct}%"></i></div>`;
  if(el.dataset.h !== html){ el.dataset.h = html; el.innerHTML = html; }
}

  const sy = window.scrollY, rects = list.map(el=>el.getBoundingClientRect());
  if(compact){ const r = rects[idx]; const want = e.clientY - (r.top + r.height/2); if(Math.abs(want) > 4){ window.scrollBy(0, -want); } }
  const sy2 = window.scrollY, R2 = list.map(el=>el.getBoundingClientRect());
  DND = {ctx, row, list, from:idx, to:idx, centers: R2.map(r=>r.top + r.height/2 + sy2), hs: R2.map(r=>r.height), gap: 8, cy: e.clientY, raf:0};
  row.classList.add('dragging'); list.forEach(el=>{ if(el!==row) el.classList.add('dnd-sib'); });
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  try{ S.vibe!==false && navigator.vibrate && navigator.vibrate(10); }catch(err){}
  dndLayout();
  const loop = ()=>{ if(!DND) return; const y = DND.cy, H = window.innerHeight; let v = 0; if(y > H-90) v = Math.min(14, (y-(H-90))/5); else if(y < 90) v = -Math.min(14, (90-y)/5);
    if(v){ window.scrollBy(0, v); dndLayout(); } DND.raf = requestAnimationFrame(loop); };
  DND.raf = requestAnimationFrame(loop);
});
function dndLayout(){
  const D = DND; if(!D) return; const p = D.cy + window.scrollY, c0 = D.centers[D.from];
  D.row.style.transform = `translateY(${p - c0}px) scale(1.02)`;
  let to = D.from; D.centers.forEach((c,i)=>{ if(i>D.from && p > c) to = Math.max(to,i); if(i<D.from && p < c) to = Math.min(to,i); });
  if(to !== D.to){ try{ S.vibe!==false && navigator.vibrate && navigator.vibrate(5); }catch(err){} }
  D.to = to; const H = D.hs[D.from] + D.gap;
  D.list.forEach((el,i)=>{ if(el===D.row) return; let sh = 0; if(D.from<to && i>D.from && i<=to) sh = -H; if(D.from>to && i<D.from && i>=to) sh = H; el.style.transform = sh ? `translateY(${sh}px)` : ''; });
}
document.addEventListener('pointermove', e=>{ if(!DND) return; DND.cy = e.clientY; dndLayout(); });
function dndEnd(){
  if(!DND) return; const {ctx, from, to, list, raf} = DND; cancelAnimationFrame(raf); list.forEach(el=>{ el.style.transform=''; el.classList.remove('dragging','dnd-sib'); }); DND = null;
  document.body.classList.remove('dnd-compact');
  if(from===to || from<0){ return; }
  const mv = A=>{ const [x] = A.splice(from,1); A.splice(to,0,x); };
  if(ctx==='act' && S.active) mv(S.active.items); else if(ctx==='rt' && ui.rtDraft) mv(ui.rtDraft.ex); else if(ctx.startsWith('pd:') && S.program) mv(S.program.days[+ctx.slice(3)].ex);

(function keyboardFix(){
  const vv = window.visualViewport, root = document.documentElement;
  const isField = el => !!el && ((el.tagName==='INPUT' && !['checkbox','radio','color','range','button'].includes(el.type)) || el.tagName==='TEXTAREA');
  let open = false;
  function keep(){
    const el = document.activeElement; if(!isField(el)) return;
    if(el.closest('.sheet, #onb')){ el.scrollIntoView({block:'center', behavior:'smooth'}); return; }
    const r = el.getBoundingClientRect(), top = vv ? vv.offsetTop : 0, vh = vv ? vv.height : window.innerHeight;
    const card = el.closest('.item, .rte-row, .ew-item, .panel'); const cr = card ? card.getBoundingClientRect() : r;
    const want = top + 64;                       /* üstteki başlığın hemen altı */
    if(r.bottom > top + vh - 10 || r.top < want || (window.innerWidth<=700 && r.top > top + vh*0.42)){ window.scrollBy({top: Math.min(cr.top, r.top - 40) - want, behavior:'smooth'}); }
  }
  function update(){
    const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    const now = kb > 120 && isField(document.activeElement);
    root.style.setProperty('--kb', (now ? kb : 0) + 'px');
    if(now !== open){ open = now; document.body.classList.toggle('kb-open', now); }
    if(now) keep();
  }
  if(vv){ vv.addEventListener('resize', update); vv.addEventListener('scroll', update); }
  document.addEventListener('focusin', e=>{ if(isField(e.target)){ document.body.classList.add('kb-focus'); setTimeout(update, 60); setTimeout(()=>{ update(); keep(); }, 350); setTimeout(keep, 700); } });
  document.addEventListener('focusout', ()=>setTimeout(()=>{ if(!isField(document.activeElement)){ document.body.classList.remove('kb-focus'); update(); } }, 120));
})();

const TABS = ['anasayfa','antrenman','egzersizler','gecmis','beslenme','ranklar','profil','aktif'];
function route(){
  const h = location.hash.replace('#','');
  if(h.startsWith('kas-') && MK[h.slice(4)]){ ui.kas = h.slice(4); ui.tab = 'kas'; }
  else if(h.startsWith('ex-') && EXM[h.slice(3)]){ if(ui.det!==h.slice(3)) ui.dtab='hakkinda'; ui.det = h.slice(3); ui.tab = 'detay'; }
  else ui.tab = TABS.includes(h) ? h : 'anasayfa';
  if(ui.tab==='antrenman' && S.active && !ui.minimized){ ui.tab='aktif'; try{ history.replaceState(null,'','#aktif'); }catch(e){} }
  if(ui.tab!=='antrenman') ui.minimized = false;
  render(); window.scrollTo(0,0);
}

/* ---------- tam ekran ---------- */
(function fullscreen(){
  const btn = $('#fsBtn'), el = document.documentElement;
  const ON = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OFF = '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  const can = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const isFs = ()=>!!(document.fullscreenElement || document.webkitFullscreenElement);
  const enter = ()=>{ try{ const r = (el.requestFullscreen||el.webkitRequestFullscreen).call(el, {navigationUI:'hide'}); if(r&&r.catch) r.catch(()=>{}); }catch(e){} };
  const exit = ()=>{ try{ const r = (document.exitFullscreen||document.webkitExitFullscreen).call(document); if(r&&r.catch) r.catch(()=>{}); }catch(e){} };
  if(!can){ btn.hidden = true; return; }
  const sync = ()=>{ btn.innerHTML = isFs() ? OFF : ON; btn.setAttribute('aria-label', isFs() ? 'Tam ekrandan çık' : 'Tam ekran'); };
  sync();
  btn.addEventListener('click', ()=> isFs() ? exit() : enter());
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  // telefonda ilk dokunuşta otomatik tam ekran
  if(window.matchMedia && matchMedia('(pointer: coarse)').matches){
    const first = e=>{ if(e.target.closest && e.target.closest('#fsBtn')) return; if(!isFs()) enter(); };
    document.addEventListener('pointerup', first, {once:true, capture:true});
  }
})();

/* ---------- giriş animasyonu ---------- */
/* ---------- açılış animasyonları: "yeni" (varsayılan) ve "klasik" (yedek) ---------- */
function introCloneFig(){
  const fig = document.querySelector('#figs .fig-front').cloneNode(true);
  fig.removeAttribute('class'); fig.querySelectorAll('[id]').forEach(n=>{ if(n.tagName!=='linearGradient'&&n.tagName!=='radialGradient'&&n.tagName!=='filter'&&n.tagName!=='clipPath') n.removeAttribute('id'); });
  fig.querySelectorAll('.m,.m2').forEach(p=>p.removeAttribute('style'));
  return fig;
}
function introClose(box, timers, preview){
  return ()=>{ if(box.dataset.closed) return; box.dataset.closed = '1'; timers.forEach(clearTimeout);
    if(!preview && !S.onbDone && !ui.onb) openOnb(true);
    box.classList.add('out'); document.body.classList.remove('intro-on'); setTimeout(()=>box.remove(), 500); };
}
/* KLASİK açılış (yedek): kaslar aşağıdan yukarı kırmızı yanıp söner */
function introClassic(box, preview){
  box.className = ''; box.innerHTML = '<div class="intro-fig" id="introFig"></div><div class="intro-mark"><span></span>MuscleRank</div><div class="intro-sub">Gücünü kas kas takip et</div><div class="intro-rank"></div>';
  const MR = mainRank(), MC = MR ? MR.tier.c : TIERS[0].c;
  document.body.classList.add('intro-on');
  const fig = introCloneFig(); box.querySelector('#introFig').appendChild(fig);
  const timers = [], close = introClose(box, timers, preview);
  box.addEventListener('click', close);
  requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.add('go')));
  const ms = [...fig.querySelectorAll('.m')].filter(p=>p.dataset.m!=='kalca');
  const ys = ms.map(p=>{ try{ const bb=p.getBBox(); return bb.y+bb.height/2; }catch(e){ return 0; } });
  const lo = Math.min(...ys), hi = Math.max(...ys);
  ms.forEach((p,i)=>{ const t = 450 + (1-(ys[i]-lo)/((hi-lo)||1))*750;
    timers.push(setTimeout(()=>{ p.style.fill=MC; }, t)); timers.push(setTimeout(()=>{ p.style.fill=''; }, t+520)); });
  timers.push(setTimeout(()=>ms.forEach(p=>{ p.style.fill=MC; }), 1750));
  timers.push(setTimeout(()=>{ const ir = box.querySelector('.intro-rank'); ir.style.setProperty('--tc', MC); ir.innerHTML = `${mythBadge(MR, 44)}<span><small>ANA RANKIN</small><b>${MR?MR.label:'Başlangıç'}</b><em>${mythOf(MR).n}</em></span>`; if(MR && MR.i===TOP) box.classList.add('zeus-flash'); ir.classList.add('on'); }, 1900));
  timers.push(setTimeout(close, 3100));
}
/* YENİ açılış (sinematik): parçacıklar, kas taraması, rank yolculuğu, şok dalgası, parlayan logo */
function introNew(box, preview){
  box.className = 'v2 v3';
  const word = 'MuscleRank'.split('').map((ch,i)=>`<span class="l" style="--i:${i}">${ch}</span>`).join('');
  box.innerHTML = `<div class="i3-rays"></div><div class="i2-halo"></div>
    <div class="i2-fig" id="i2Fig"><i class="i3-scan"></i><i class="i3-shock"></i><i class="i3-shock s2"></i></div>
    <div class="i2-rank"><span class="i2-emb"></span><span class="i2-tw"><small>ANA RANKIN</small><b class="i2-tier"></b></span></div>
    <div class="i2-mark"><span class="dot"></span><span class="i3-word">${word}</span></div><div class="i2-sub">Gücünü kas kas takip et</div><div class="i2-tap">Geçmek için dokun</div>`;
  document.body.classList.add('intro-on');
  const fx = makeFX(box, {ambient: 46, color:'#9fb6ff'});
  const host = box.querySelector('#i2Fig'), fig = introCloneFig(); host.prepend(fig);
  const ms = [...fig.querySelectorAll('.m,.m2')];
  const timers = [], close0 = introClose(box, timers, preview), close = ()=>{ fx.stop(); close0(); };
  box.addEventListener('click', close);
  requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.add('go')));
  const ys = ms.map(p=>{ try{ const bb=p.getBBox(); return bb.y+bb.height/2; }catch(e){ return 0; } });
  const lo = Math.min(...ys), hi = Math.max(...ys);
  /* 1) tarama: kaslar yukarıdan aşağı parlayarak “uyanır” */
  timers.push(setTimeout(()=>box.classList.add('scan'), 450));
  ms.forEach((p,i)=>{ const t = 520 + (ys[i]-lo)/((hi-lo)||1)*700; timers.push(setTimeout(()=>{ p.style.fill = '#dbe8ff'; }, t)); timers.push(setTimeout(()=>{ p.style.fill = ''; }, t+260)); });
  /* 2) rank yolculuğu */
  const rankEl = box.querySelector('.i2-rank'), emb = box.querySelector('.i2-emb'), tier = box.querySelector('.i2-tier'), halo = box.querySelector('.i2-halo');
  const T0 = 1350, STEP = 170, MR = mainRank(), lastTi = MR ? Math.floor(MR.i/DV) : 0;
  /* henüz rankı yoksa: Olimpos’a kadar bütün yolculuğu göster, sonra başlangıca dön */
  const steps = MR ? TIERS.slice(0, lastTi+1) : TIERS.concat([TIERS[0]]);
  steps.forEach((t,ti)=>{
    const fin = ti===steps.length-1;
    timers.push(setTimeout(()=>{
      const r = fin ? (MR || rankAt(0)) : rankAt(Math.min(TOP, ti*DV));
      ms.forEach(p=>{ p.style.fill = t.c; });
      rankEl.classList.add('on'); rankEl.style.setProperty('--tc', t.c); box.style.setProperty('--tc', t.c); fx.setColor(t.c);
      emb.innerHTML = emblem(r, 34); emb.classList.remove('pop'); void emb.offsetWidth; emb.classList.add('pop');
      tier.textContent = fin ? (MR ? MR.label : 'BAŞLANGIÇ').toLocaleUpperCase('tr') : t.n.toLocaleUpperCase('tr');
      halo.style.setProperty('--hc', t.c + '66');
      if(fin){
        box.classList.add('peak','final'); rankEl.classList.add('final'); emb.innerHTML = mythBadge(MR, 40);
        const my = document.createElement('em'); my.className = 'i2-myth'; my.textContent = mythOf(MR).n; tier.after(my);
        const rr = host.getBoundingClientRect(); fx.burst(rr.left+rr.width/2, rr.top+rr.height*.42, t.c, MR && MR.i===TOP ? 180 : 120, 1.3);
        setTimeout(()=>fx.burst(rr.left+rr.width/2, rr.top+rr.height*.42, '#ffffff', 50, 1.7, 's'), 140);
        if(MR && MR.i===TOP) box.classList.add('zeus-flash');
      }
    }, T0 + ti*STEP + (fin && steps.length>1 ? 160 : 0)));
  });
  const endT = T0 + steps.length*STEP + 200;
  timers.push(setTimeout(()=>box.classList.add('brand'), endT + 300));
  timers.push(setTimeout(close, endT + 2300));
}
function playIntro(preview){
  let box = document.getElementById('intro');
  if(!box){ box = document.createElement('div'); box.id = 'intro'; box.setAttribute('aria-hidden','true'); document.body.appendChild(box); }
  delete box.dataset.closed;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce && !preview){ if(!S.onbDone) openOnb(true); box.remove(); return; }
  if(S.introStyle==='kapali' && !preview){ if(!S.onbDone) openOnb(true); box.remove(); return; }
  if(S.introStyle==='klasik') introClassic(box, preview); else introNew(box, preview);
}

function startDemo(){ try{ sessionStorage.setItem('mr-demo','1'); }catch(e){} location.reload(); }
function exitDemo(){ try{ sessionStorage.removeItem('mr-demo'); }catch(e){} location.reload(); }
function showWhatsNew(){
  let el = document.getElementById('onb'); if(el) return;
  el = document.createElement('div'); el.id = 'onb'; el.className = 'full first'; document.body.appendChild(el); document.body.classList.add('onb-on');
  setTimeout(()=>el.classList.remove('first'), 400);
  el.innerHTML = `<div class="onb-card"><div class="onb-body">
    <div class="onb-brand"><span></span>MuscleRank</div>
    <h2>✨ Yenilikler</h2><p>Uygulamaya yeni şeyler ekledik. İstersen bunları yeni bir kullanıcı gibi baştan deneyebilirsin; gerçek verilerin etkilenmez.</p>
    <ul class="wn">${WHATS_NEW.map(([ic,t,d])=>`<li><span class="wn-ic">${ic}</span><div><b>${t}</b><small>${d}</small></div></li>`).join('')}</ul>
    <button class="btn go" data-act="wn-demo">🧪 Yeni kullanıcı gibi dene</button>
    <button class="onb-skip" data-act="wn-close">Şimdi değil, uygulamaya geç</button></div></div>`;
}
function closeWhatsNew(){ S.seenVersion = APP_VERSION; save(); const el = document.getElementById('onb'); if(el) el.remove(); document.body.classList.remove('onb-on'); }
function maybeWhatsNew(){ if(DEMO || !S.onbDone || ui.onb || S.seenVersion===APP_VERSION) return; if(!S.seenVersion && !S.workouts.length && !S.account){ S.seenVersion = APP_VERSION; save(); return; } showWhatsNew(); }
function demoBanner(){ if(!DEMO) return; const d = document.createElement('div'); d.className = 'demo-bar'; d.innerHTML = '🧪 Deneme modu: yeni kullanıcı gibi geziyorsun, gerçek verilerin etkilenmiyor. <button data-act="demo-exit">Çık</button>'; document.body.appendChild(d); document.body.classList.add('demo-on'); }
demoBanner();

playIntro(false);
setTimeout(maybeWhatsNew, 3800);
</script>
