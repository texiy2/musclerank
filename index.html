<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MuscleRank">
<title>MuscleRank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f2f4f7; --ink:#1b2030; --muted:#5b6377; --line:#dde1e8;
  --accent:#f2c230; --accent-ink:#1b2030; --blue:#2c5fd0; --danger:#c8322c;
  --screen:#15151d; --screen-2:#0f0f15; --screen-ink:#eef0f5; --screen-muted:#a2aabd;
  --red:#e5322d; --red-soft:#f3a397;
  --ol:#1d1a24; --skin:#ecb894; --skin-s:#c98d68; --hair:#3b2a20; --shorts:#2d58b8; --shorts-s:#1f3f86; --shoe:#f4f4f4; --floor:rgba(0,0,0,.28);
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141824; --surface:#1d2230; --surface-2:#252b3b; --ink:#eceff5; --muted:#9aa2b6; --line:#2f3648;
    --blue:#7aa2ff; --danger:#ff6b61; --screen:#222838; --screen-2:#1a1f2d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141824; --surface:#1d2230; --surface-2:#252b3b; --ink:#eceff5; --muted:#9aa2b6; --line:#2f3648;
  --blue:#7aa2ff; --danger:#ff6b61; --screen:#222838; --screen-2:#1a1f2d; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 10px;max-width:none;margin:0 auto}
.top-r{display:flex;align-items:center;gap:8px}
.fs-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.fs-btn[hidden]{display:none}
.fs-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wordmark{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.3px;margin:0;line-height:1;display:flex;align-items:center;gap:8px}
.wordmark span{width:14px;height:14px;border-radius:50%;background:var(--red)}
.live{display:none;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px;background:var(--ink);color:var(--bg);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.live.on{display:flex}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);display:block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.layout{max-width:1120px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) clamp(132px,36%,340px);gap:32px;align-items:start}
@media (max-width:700px){.layout{gap:20px}}
@media (max-width:420px){.layout{padding:0 10px;gap:16px}}
main{min-width:0}

/* character window */
.char{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--screen);color:var(--screen-ink);border-radius:14px;overflow:hidden}
.char-bar{display:flex;align-items:center;gap:6px;padding:10px 14px 4px;font-family:var(--display);font-weight:600;font-size:17px}
.char-bar span{margin-left:auto;color:var(--screen-muted);font-size:14px;font-weight:600}
.stage{padding:10px 8px 4px;background:radial-gradient(ellipse at 50% 40%, #232331, transparent 72%)}
.figs{display:flex;justify-content:center;gap:4%}
.fig{width:47%;height:auto;max-height:58vh;display:block}
.figs.single .fig{width:84%}
.figs.single[data-view="front"] .fig-back,.figs.single[data-view="back"] .fig-front{display:none}
.m{transition:stroke .3s ease}
.views{display:flex;justify-content:space-around;gap:6px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--screen-muted);padding:2px 10px 10px}
.views button{flex:1;background:var(--screen-2);border:0;color:var(--screen-muted);border-radius:999px;padding:5px 0;font-family:var(--display);font-weight:600;font-size:15px}
.views button[aria-pressed="true"]{background:var(--screen-ink);color:var(--screen)}
.char-info{padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,.08)}
.char-info h3{margin:0 0 6px;font-size:16px;line-height:1.25;font-weight:700}
.char-info p{margin:0;color:var(--screen-muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;line-height:1.5}
.tag.p{background:var(--red);color:#fff}
.tag.s{background:var(--red-soft);color:#3a1210}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--screen-muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (max-width:420px){.char-info{padding:10px}.char-info h3{font-size:14px}.tag{font-size:11px;padding:1px 6px}.legend,.char-bar span{display:none}}
.stage{cursor:zoom-in}
.char-x{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--screen-2);color:var(--screen-ink);display:grid;place-items:center;padding:0}
.char-bar span+.char-x{margin-left:10px}
.char-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.char.big{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px);left:12px;right:12px;max-width:760px;margin:0 auto;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:grow .22s ease-out}
.char.big .stage{cursor:zoom-out;padding:16px 12px 8px}
.char.big .fig{width:48%;max-height:calc(100vh - 340px);max-height:calc(100dvh - 340px)}
.char.big .char-bar{font-size:20px;padding:14px 16px 6px}
.char.big .char-bar span,.char.big .legend{display:flex}
.char.big .char-info{padding:14px 18px 18px}
.char.big .char-info h3{font-size:19px}
.char.big .tag{font-size:13px;padding:3px 10px}
body.charopen{overflow:hidden}
body.charopen::after{content:"";position:fixed;inset:0;z-index:55;background:rgba(6,6,10,.62)}
@keyframes grow{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
/* tek sütun: karakter üstte ortada, egzersizler altta ortada */
.layout,.layout[class]{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:none;width:100%;padding:0 12px}
.layout main{width:100%}
.char{order:-1;width:100%;max-width:520px;z-index:8;box-shadow:0 -14px 0 var(--bg),0 10px 18px -12px rgba(0,0,0,.35)}
.char:not(.big) .char-bar{padding:8px 12px 2px;font-size:16px}
.char:not(.big) .stage{padding:4px 8px 2px}
.char:not(.big) .figs{gap:10%}
.char:not(.big) .fig{width:auto;height:112px;max-height:none}
.char:not(.big) .views{display:none}
.char:not(.big) .char-info{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px 10px}
.char:not(.big) .char-info h3{margin:0;font-size:15px}
.char:not(.big) .char-info p{font-size:12px;width:100%}
.char:not(.big) .tags{margin-top:0}
.char:not(.big) .legend{display:none}
@media (max-width:420px){.char:not(.big) .fig{height:96px}.char:not(.big) .char-bar span{display:inline}.char:not(.big) .char-info p{display:none}}
.char:not(.big) .char-bar{padding:6px 10px 0;font-size:14px}
.char:not(.big) .char-x{width:26px;height:26px}
.char:not(.big) .char-info{padding:6px 10px 8px}
.char:not(.big) .char-info h3{font-size:13px}
.char:not(.big) .tag{font-size:11px;padding:1px 7px}
.char:not(.big){max-width:440px}

/* blocks */
.panel{container-type:inline-size;background:var(--surface);border-radius:14px;padding:16px;margin-bottom:14px}
.h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 10px;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin:0}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(26px,11cqi,44px);line-height:1;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.clock.idle{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:16px;background:var(--surface-2);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--accent);color:var(--accent-ink);width:100%;font-family:var(--display);font-size:19px;padding:12px 14px;border-radius:11px}
.btn.stop{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:8px 4px}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .btn.stop{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);line-height:1.25;display:block}
@media (max-width:420px){.stat{padding:8px}.stat b{font-size:20px}.stat span{font-size:11px}}

/* library */
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.sub{margin-top:-2px}
.chips.sub .chip{font-size:12px;padding:4px 11px}
.chips.sub .chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.lib{list-style:none;margin:0;padding:0}
.lib li+li{border-top:1px solid var(--line)}
.ex{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 6px;border-radius:8px}
.ex:hover{background:var(--surface-2)}
.ex[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--red)}
.ex-t{flex:1;min-width:0}
.ex-t b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.ex-t small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:2px}
.ex .add{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.ex .add.done{background:var(--surface-2);color:var(--muted);font-size:14px;box-shadow:inset 0 0 0 1px var(--line)}
.empty{color:var(--muted);padding:12px 4px;margin:0}

/* workout items */
.item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.item.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.item-head{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px 6px}
.item-head b{display:block;font-size:16px;line-height:1.25}
.item-head small{color:var(--muted);font-size:12px}
.sets{list-style:none;margin:0;padding:0 14px}
.sets li{display:flex;align-items:center;gap:8px;padding:4px 0;font-variant-numeric:tabular-nums;font-size:14px}
.sets li em{font-style:normal;font-family:var(--display);font-weight:600;color:var(--muted);width:20px}
.sets li span{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.setform{display:flex;gap:6px;padding:8px 14px 10px;align-items:flex-end;flex-wrap:wrap}
.setform label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.setform input{width:64px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.setform .btn{padding:9px 12px;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.item-foot{display:flex;justify-content:space-between;align-items:center;padding:0 14px 6px}
.item-foot small{color:var(--muted);font-size:12px}
@media (max-width:420px){.setform input{width:52px}.item-head b{font-size:15px}}

/* history */
.hist{list-style:none;margin:0;padding:0}
.hist>li{border-radius:12px;margin-bottom:10px;background:var(--surface)}
.hist-head{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px;align-items:flex-start}
.hist-head .d{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;min-width:40px;text-align:center}
.hist-head .d small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}
.hist-head .t{flex:1;min-width:0}
.hist-head .t b{display:block}
.hist-head .t small{color:var(--muted);font-size:12px}
.hist-body{padding:0 14px 14px}
.hist-body h4{margin:10px 0 2px;font-size:14px}
.hist-body p{margin:0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* profile */
.name{font-family:var(--display);font-size:28px;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:none;padding:2px 0;width:100%;max-width:320px}
.ranks{list-style:none;margin:0;padding:0}
.rk{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;text-align:left;background:none;border:0;padding:10px 6px;border-radius:8px;align-items:center}
.rk[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--red)}
.ranks li+li{border-top:1px solid var(--line)}
.grp{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 0 2px}
.panel .h2+.grp{margin-top:4px}
.rk b{font-weight:600}
.badge{font-family:var(--display);font-weight:700;font-size:15px;padding:2px 10px;border-radius:999px;color:#1b1b22;white-space:nowrap}
.bar{grid-column:1 / -1;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.rk small{grid-column:1 / -1;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{flex:1;min-width:0;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;white-space:nowrap}
.tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] svg{color:var(--red)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:440px;max-height:80vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
@media (min-width:700px){.modal{align-items:center}}
.sheet h2{font-family:var(--display);font-weight:700;margin:0 0 8px;font-size:26px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.gain{list-style:none;margin:10px 0 0;padding:0}
.gain li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.gain li.up b{color:var(--danger)}
/* rank ekranı */
.rpanel{background:var(--screen);color:var(--screen-ink);border-radius:16px;padding:16px 14px 14px;margin-bottom:14px}
.rpanel .h2{color:#fff}
.rpanel .note{color:var(--screen-muted)}
.rgroup{margin-top:12px}
.rg-head{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:14px;padding:12px 14px;color:#fff;text-align:left;background:#2a2a36;background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 50%,#1a1a24),color-mix(in srgb,var(--tc) 14%,#1a1a24))}
.rg-icon{width:48px;height:52px;flex:none;display:grid;place-items:center;background:var(--tc);clip-path:polygon(50% 0,96% 25%,96% 75%,50% 100%,4% 75%,4% 25%)}
.rg-icon svg{width:24px;height:24px;fill:#1b1b22;opacity:.85}
.rg-t b{display:block;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05}
.rg-t em{display:block;font-style:normal;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.6px;line-height:1.05;color:var(--tc);color:color-mix(in srgb,var(--tc) 65%,#fff)}
.chev{margin-left:auto;width:24px;height:24px;flex:none;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.rg-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rlist{list-style:none;margin:10px 0 0;padding:0 0 0 8px;display:grid;gap:10px}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid #34343f;border-color:color-mix(in srgb,var(--tc) 50%,#262631);background:#1e1e28;border-radius:14px;padding:10px 12px;color:var(--screen-ink)}
.rrow[aria-current="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.thumb{width:58px;height:58px;flex:none;border-radius:50%;background:#262632;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
.thumb svg{width:100%;height:100%;display:block}
.rr-t{flex:1;min-width:0}
.rr-t b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.rr-t em{display:block;font-style:normal;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.4px;line-height:1.15;color:var(--tc)}
.rrow .bar{display:block;height:5px;margin-top:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.rrow .bar i{background:var(--tc)}
.rrow small{display:block;font-size:11px;color:var(--screen-muted);margin-top:3px}
.emb{flex:none;overflow:visible;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
@media (max-width:420px){.rrow{gap:10px;padding:9px 10px}.thumb{width:50px;height:50px}.emb{width:42px;height:42px}.rr-t b{font-size:15px}.rr-t em{font-size:16px}.rg-t b{font-size:20px}.rg-t em{font-size:18px}}
body[data-tab="ranklar"] .char,body[data-tab="anasayfa"] .char,body[data-tab="gecmis"] .char,body[data-tab="beslenme"] .char,body[data-tab="kas"] .char{display:none}
body[data-tab="antrenman"] .live.on{display:none}
@media (max-width:420px){.wordmark{font-size:24px}.live{font-size:16px;padding:4px 10px}.top{padding:10px 12px 8px}}
.hero .btn.go{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:12px;text-decoration:none}
.hero .btn.go .js-timer{font-variant-numeric:tabular-nums;opacity:.8}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;margin-bottom:14px}
.mapcard{background:var(--screen);color:var(--screen-ink);border-radius:16px;padding:14px}
.mc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.mc-head h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;color:#fff}
.mc-head span,.mc-head a{font-size:13px;color:var(--screen-muted);text-decoration:none}
.mc-head a{color:#9cc7ff;font-weight:600}
.maps{display:flex;justify-content:center;gap:8%;padding:8px 0 4px;background:radial-gradient(ellipse at 50% 45%,#242433,transparent 70%)}
.mapfig{height:240px;width:auto;display:block}
@media (max-width:420px){.mapfig{height:210px}}
.legend2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--screen-muted);margin-top:8px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.fatlist{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:7px}
.fatlist li{display:flex;align-items:center;gap:8px;font-size:14px}
.fatlist li i{width:10px;height:10px;border-radius:50%;flex:none}
.fatlist li b{font-weight:600}
.fatlist li span{color:var(--screen-muted);font-size:12px;margin-left:auto;text-align:right}
.fatlist .none{color:var(--screen-muted);font-size:13px}
.tier-head{cursor:default}
.ladder{cursor:default}
.ladder .rr-t b{font-family:var(--display);font-weight:700;font-size:20px;color:var(--tc)}
.ladder .rr-t small{font-size:13px}
.rk-no{flex:none;font-family:var(--display);font-weight:700;font-size:22px;color:var(--screen-muted);opacity:.7}
.mchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mchips span{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.12);background:color-mix(in srgb,var(--tc) 32%,transparent);color:#fff}
.sets li span.srank{flex:none}
.srank{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;color:#1b1b22;white-space:nowrap}
.bwl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:14px;color:var(--muted)}
.bwl input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.bwl small{width:100%;font-size:12px}
/* giriş animasyonu */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 50% 42%,#262635 0%,#0c0c12 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
.intro-fig{height:min(48vh,420px);aspect-ratio:482/1084;position:relative;opacity:0;transform:translateY(14px) scale(.94);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.intro-fig::after{content:"";position:absolute;left:10%;right:10%;bottom:-2%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(229,50,45,.45),transparent);opacity:0;transition:opacity .6s ease .5s}
#intro.go .intro-fig{opacity:1;transform:none}
#intro.go .intro-fig::after{opacity:1}
.intro-fig svg{width:100%;height:100%;display:block}
.intro-fig .m{transition:fill .25s ease,stroke .25s ease}
.intro-mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.5px;color:#fff;opacity:0;transform:translateY(10px);transition:opacity .5s ease .75s,transform .6s cubic-bezier(.2,.8,.2,1) .75s}
.intro-mark span{width:18px;height:18px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(229,50,45,.6)}
#intro.go .intro-mark{opacity:1;transform:none}
#intro.go .intro-mark span{animation:ring 1.2s ease-out 1.1s}
@keyframes ring{to{box-shadow:0 0 0 18px rgba(229,50,45,0)}}
.intro-sub{font-size:14px;color:#9aa2b6;letter-spacing:.4px;margin-top:-12px;opacity:0;transition:opacity .5s ease 1.05s}
#intro.go .intro-sub{opacity:1}
body.intro-on{overflow:hidden}
/* hareket detay */
body[data-tab="detay"] .char{display:none}
.exrow{display:flex;align-items:center;gap:4px}
.exrow .ex{flex:1;min-width:0}
.exrow .emb{flex:none;filter:none}
.exinfo{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:700;font-family:Georgia,serif;font-style:italic;font-size:14px;display:grid;place-items:center;padding:0}
.item-foot span .btn{margin-left:6px}
.dhead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.dhead h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0}
.dback{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;padding:0}
.dback svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:12px}
.dtabs button{border:0;background:none;border-radius:9px;padding:9px 2px;font-weight:600;font-size:14px;color:var(--muted)}
.dtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.lg2{display:flex;gap:8px;align-items:center;font-size:12px}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}
.mlist{display:grid;gap:8px;margin-top:10px}
.mlist div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mlist small{color:var(--screen-muted);width:72px;font-size:12px}
.rcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-radius:18px;padding:16px;margin-bottom:12px;color:#fff;background:#24202e;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 42%,#1b1b25),#1b1b25);border:2px solid color-mix(in srgb,var(--tc) 60%,transparent)}
.rc-l{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.rc-l b{font-family:var(--display);font-weight:700;font-size:20px;color:var(--tc)}
.rc-l span{font-size:13px;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 10px}
.rc-r{display:grid;gap:1px}
.rc-r small{color:#b8b8c6;font-size:11px;margin-top:6px}
.rc-r small:first-child{margin-top:0}
.rc-r b{font-size:16px}
.rcard .bar{grid-column:1 / -1;height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.rcard .bar i{display:block;height:100%;background:var(--tc)}
.ladder3{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ladder3 li{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:12px}
.ladder3 li b{font-family:var(--display);font-weight:700;font-size:19px;color:var(--tc);min-width:86px}
.ladder3 li span{font-size:12px;color:var(--screen-muted)}
.ladder3 li em{margin-left:auto;font-style:normal;font-weight:700;color:#fff;font-size:13px}
.ladder3 li.cur{background:color-mix(in srgb,var(--tc) 28%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 60%,transparent)}
.ladder3 .emb{filter:none}
.chart{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line);stroke-dasharray:3 4}
.chart .cy,.chart .cx{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .cy{text-anchor:end}
.chart .cl{fill:none;stroke:#3a8bf0;stroke-width:2.5;stroke-linejoin:round}
.chart .ca{fill:#3a8bf0;opacity:.14}
.chart .cd2{fill:#3a8bf0}
.statbig{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:6px}
.statbig b{font-family:var(--display);font-size:30px}
.statbig .upv{color:#21a548;font-weight:700}
.statbig .downv{color:var(--danger);font-weight:700}
.statbig small{color:var(--muted)}
.prlist{list-style:none;margin:0;padding:0}
.prlist li{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:15px}
.prlist li:first-child{border-top:0}
.hc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hc-top small{color:var(--muted);font-size:12px}
.hsets{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hsets li{display:flex;align-items:center;gap:8px;font-size:15px;font-variant-numeric:tabular-nums}
.hsets li span:first-child{flex:1}
.hsets li b{min-width:44px;text-align:right}
/* hareket listesi küçük resim çerçevesi */
.exrow{content-visibility:auto;contain-intrinsic-size:auto 64px}
.exth{position:relative;flex:none;width:52px;height:52px;border-radius:14px;background:#1d1d27;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 1px 3px rgba(0,0,0,.15);overflow:visible}
.exth>svg{width:100%;height:100%;display:block;border-radius:14px}
.exth .eq{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--surface),0 1px 3px rgba(0,0,0,.25);display:grid;place-items:center}
.exth .eq svg{width:13px;height:13px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ex{gap:12px}
/* dokunmatik kas haritası */
.fig .m,.fig .m2{cursor:pointer}
.fig .tap{stroke:#ffffff;stroke-width:7;stroke-linejoin:round}
.tapex{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tapex button{border:0;border-radius:999px;padding:6px 11px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600}
.untap{display:block;margin-top:10px;border:0;background:none;color:var(--screen-muted);font-size:12px;text-decoration:underline;padding:0}
.taphint{margin-top:8px!important;font-size:12px;color:var(--screen-muted)}
/* geçmiş antrenman düzenleme */
.ew-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ew-meta label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:140px}
.ew-meta input{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:15px}
.ew-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ew-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ew-set{display:flex;align-items:flex-end;gap:8px;padding:4px 0}
.ew-set em{font-style:normal;font-family:var(--display);font-weight:600;color:var(--muted);width:18px;padding-bottom:9px}
.ew-set label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.ew-set input{width:72px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.ew-set .x{padding-bottom:8px}
.ew-add{margin:6px 0 4px}
.ew-res{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600}
.ew-acts{justify-content:flex-end;margin-top:12px}
.ew-acts .btn.go{width:auto;font-size:18px;padding:12px 26px}
/* ranklar: hareket arama tablosu */
.lk-res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 2px;border-bottom:1px solid var(--line)}
.lk-res span b{display:block;font-weight:600}
.lk-res span small{color:var(--muted);font-size:12px}
.lk-head{display:flex;align-items:center;gap:12px;margin:14px 0 8px}
.lk-head b{display:block;font-size:18px}
.lk-head small{color:var(--muted);font-size:13px}
.lk-reps{margin-bottom:6px}
.lk-table{list-style:none;margin:0;padding:0;border-radius:12px;overflow:hidden;background:var(--screen)}
.lk-table li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:var(--screen-ink)}
.lk-table .emb{filter:none;flex:none}
.lk-l{font-family:var(--display);font-weight:700;font-size:16px;color:var(--tc);min-width:104px}
.lk-v{font-variant-numeric:tabular-nums;font-weight:600;flex:1}
.lk-table li em{font-style:normal;font-weight:700;font-size:12px;color:#fff}
.lk-table li.me{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--tc)}
/* karşılama sihirbazı */
#onb{position:fixed;inset:0;z-index:150;background:rgba(10,10,16,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#onb{align-items:center}}
body.onb-on{overflow:hidden}
.onb-card{width:100%;max-width:460px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border-radius:22px;padding:18px 18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#onb.first .onb-card{animation:onbIn .3s ease-out}
@keyframes onbIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.onb-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.onb-back,.onb-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);font-size:22px;line-height:1;color:var(--ink);padding:0}
.onb-dots{flex:1;display:flex;gap:6px;justify-content:center}
.onb-dots i{width:28px;height:5px;border-radius:999px;background:var(--line)}
.onb-dots i.on{background:var(--red)}
.onb-body h2{font-family:var(--display);font-weight:700;font-size:28px;margin:0 0 6px;line-height:1.1}
.onb-body p{color:var(--muted);margin:0 0 14px;font-size:15px}
.onb-hero{font-size:56px;text-align:center;margin:6px 0 4px}
.onb-body .btn.go{margin-top:6px}
.onb-skip{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);font-weight:600;text-decoration:underline}
.onb-in{display:flex;gap:10px;margin-bottom:14px}
.onb-in label{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.onb-in input{width:100%;min-width:0}
.onb-in input{padding:14px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--ink)}
.onb-list,.onb-grid{display:grid;gap:8px}
.onb-grid{grid-template-columns:1fr 1fr}
.onb-opt{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px 12px;text-align:left;font-weight:700;font-size:15px;color:var(--ink)}
.onb-opt[aria-pressed="true"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--surface))}
.onb-ic{display:block;font-size:28px;margin-bottom:6px}
.onb-days{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.onb-days .onb-opt{flex:1;min-width:64px;text-align:center;padding:12px 6px}
/* program */
.prog-top{display:flex;justify-content:space-between;align-items:baseline}
.pday{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.pday.next{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.pday-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pnext{font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:2px 9px}
.pday ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
.pday li{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.pday li span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pex{border:0;background:none;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.pstart{width:100%;font-size:15px;padding:10px}
.pday .btn.go.pstart{font-family:var(--body);font-size:16px;padding:12px}
.plan-line{margin:0 14px 4px;padding:6px 10px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted);display:flex;gap:8px;justify-content:space-between}
.plan-line b{color:var(--ink)}
.plan-line.ok{background:rgba(52,199,89,.14)}
.plan-line.ok b{color:#1e8a3a}
/* profil bilgileri, tema */
.pinfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.pinfo div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.pinfo small{display:block;font-size:11px;color:var(--muted)}
.pinfo b{font-size:14px}
@media (max-width:420px){.pinfo{grid-template-columns:1fr 1fr}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
/* rank atlama animasyonu */
.ru{position:fixed;inset:0;z-index:160;display:grid;place-items:center;padding:20px;background:#0c0c12;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--tc) 38%,#0c0c12) 0%,#0c0c12 68%);transition:opacity .25s}
.ru.out{opacity:0}
.ru-card{width:100%;max-width:360px;text-align:center;color:#fff;animation:ruIn .35s ease-out}
.ru-card small{display:block;letter-spacing:4px;font-weight:800;font-size:13px;color:var(--tc);margin-bottom:6px;animation:ruUp .4s ease-out .15s both}
.ru-emb{display:inline-block;position:relative;margin:4px 0 10px;animation:ruPop .7s cubic-bezier(.2,1.5,.4,1) .1s both}
.ru-emb::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--tc);opacity:0;animation:ruRing .9s ease-out .5s both}
.ru-emb .emb{filter:none}
.ru-card h2{font-family:var(--display);font-weight:700;font-size:34px;margin:0;animation:ruUp .4s ease-out .3s both}
.ru-card p{margin:4px 0 4px;font-size:18px;animation:ruUp .4s ease-out .4s both}
.ru-card p span{color:#a8a8b8;text-decoration:line-through}
.ru-card p b{color:var(--tc);font-family:var(--display);font-size:24px}
.rc-l .lp{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--tc);margin-top:4px}
.ru-n{color:#8e8e9e;font-size:12px;margin:8px 0 14px}
.ru-skip{display:block;margin:12px auto 0;border:0;background:none;color:#a8a8b8;font-weight:600;text-decoration:underline}
.ru-card.still,.ru-card.still *{animation:none!important}
@keyframes ruIn{from{opacity:0}to{opacity:1}}
@keyframes ruPop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes ruUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes ruRing{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
/* ilk açılış: sorular giriş animasyonunun devamı gibi, koyu tam ekran */
#onb.full{background:#0c0c12;background:radial-gradient(ellipse at 50% 42%,#262635 0%,#0c0c12 70%);align-items:center;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#onb.full .onb-card{background:transparent;box-shadow:none;color:#fff;max-height:calc(100vh - 32px)}
#onb.full .onb-body h2{color:#fff}
#onb.full .onb-body p{color:#a9a9ba}
#onb.full .onb-opt{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff}
#onb.full .onb-opt[aria-pressed="true"]{border-color:var(--red);background:rgba(229,50,45,.18)}
#onb.full .onb-in label{color:#a9a9ba}
#onb.full .onb-in input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
#onb.full .onb-back,#onb.full .onb-x{background:rgba(255,255,255,.1);color:#fff}
#onb.full .onb-dots i{background:rgba(255,255,255,.18)}
#onb.full .onb-dots i.on{background:var(--red)}
#onb.full .onb-skip{color:#8e8ea0}
.onb-brand{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:700;font-size:40px;color:#fff;margin:6px 0 18px}
.onb-brand span{width:16px;height:16px;border-radius:50%;background:var(--red)}
#onb.full.first .onb-card{animation:onbFade .5s ease-out}
@keyframes onbFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* kayıt, antrenmanlarım, klasörler */
.onb-f{display:grid;gap:10px;margin-bottom:6px}
.onb-f label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.onb-f label em{font-style:normal;font-weight:400}
.onb-f input{padding:13px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:17px;color:var(--ink);width:100%;min-width:0}
#onb.full .onb-f label{color:#a9a9ba}
#onb.full .onb-f input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
.onb-err{color:#ff6b61;font-size:13px;font-weight:600;min-height:18px;margin:4px 0 8px!important}
.onb-small{font-size:12px!important;margin-top:14px!important;text-align:center}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.go.sm{width:auto;font-family:var(--body);font-size:13px;padding:8px 14px;border-radius:9px}
.btn.go2{background:var(--ink);color:var(--bg)}
.rt-top{display:flex;flex-wrap:wrap;gap:6px}
.rt{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--surface)}
.rt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rt-h b{font-size:16px}
.rt-h small,.rt-ex{color:var(--muted);font-size:12px}
.rt-ex{margin:4px 0 10px}
.rt-a{display:flex;gap:6px;flex-wrap:wrap}
.fold{margin-top:10px;border-radius:14px;background:var(--surface-2);overflow:hidden}
.fold-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:12px;text-align:left;color:var(--ink)}
.fold-h b{font-size:15px}
.fold-h small{color:var(--muted);font-size:12px}
.fold-ic{font-size:18px}
.chev2{margin-left:auto;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.fold-h[aria-expanded="true"] .chev2{transform:rotate(180deg)}
.fold-b{padding:0 10px 10px}
.fold-b .rt{margin-top:8px}
.fold-a{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rte-row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rte-h{display:flex;align-items:center;gap:8px}
.rte-h b{flex:1;min-width:0;font-size:15px}
.inum2{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.rte-mv{display:flex;gap:2px}
.rte-in{display:flex;gap:8px;margin-top:8px}
.rte-in label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.rte-in input{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.ew-meta select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:15px;color:var(--ink)}
.pday-a{display:flex;gap:6px}
.pday-a .pstart{flex:1}
.prog-top span{display:flex;gap:2px}
.prog.locked{border:1px dashed var(--line)}
.acct{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.acct b{display:block}
.acct small{color:var(--muted);font-size:12px}
.acct-av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.acct-ok{margin-left:auto;font-size:12px;font-weight:700;color:#1e8a3a;white-space:nowrap}
.acct.none{justify-content:space-between}
/* dinlenme */
.restctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 14px 8px;padding:7px 10px;border-radius:10px;background:var(--surface-2);font-size:13px}
.restctl span{color:var(--muted);font-weight:600}
.restctl b{min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.restctl small{color:var(--muted);font-size:11px;margin-left:auto}
.rc-b{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;line-height:1;padding:0;color:var(--ink)}
#restbar{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:30;max-width:520px;margin:0 auto;background:#16161e;color:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.rb-in{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.rb-t{flex:1;min-width:0}
.rb-t small{display:block;color:#a9a9ba;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-t b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.rb-in.done .rb-t b{font-size:20px;color:#7ee29a}
.rb-btns{display:flex;gap:6px}
.rb-btns button{border:0;border-radius:10px;padding:9px 10px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:13px}
.rb-btns .rb-skip{background:var(--accent);color:var(--accent-ink)}
.rb-x{border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;padding:0}
.rb-bar{height:5px;background:rgba(255,255,255,.1)}
.rb-bar i{display:block;height:100%;background:linear-gradient(90deg,#34c759,#f5cc1f);transition:width 1s linear}
/* tema anahtarı */
.themebox{display:flex;align-items:center;justify-content:space-between;gap:12px}
.themebox .h2{margin-bottom:4px}
.thtog{position:relative;flex:none;width:86px;height:46px;border-radius:999px;border:0;padding:0;background:#dfe3ea;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:background .25s}
.thtog.dark{background:#2b3046}
.thtog .th-sun,.thtog .th-moon{position:absolute;top:50%;transform:translateY(-50%);font-size:16px;opacity:.55}
.thtog .th-sun{left:12px}.thtog .th-moon{right:12px}
.thtog .knob{position:absolute;top:4px;left:4px;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s ease}
.thtog.dark .knob{transform:translateX(40px);background:#11131c}
/* yeni açılış */
#intro.v2{gap:0}
.i2-halo{position:absolute;left:50%;top:42%;width:90vmin;height:90vmin;max-width:620px;max-height:620px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle, var(--hc, transparent) 0%, transparent 62%);opacity:.55;transition:opacity .6s ease;pointer-events:none}
#intro.v2.peak .i2-halo{opacity:1}
.i2-fig{position:relative;height:min(38vh,340px);aspect-ratio:482/1084;opacity:0;transform:translateY(18px) scale(.96);transition:opacity .55s ease, transform .8s cubic-bezier(.2,.8,.2,1)}
#intro.v2.go .i2-fig{opacity:1;transform:none}
.i2-fig svg{width:100%;height:100%;display:block}
.i2-fig .m,.i2-fig .m2{transition:fill .12s linear}
.i2-rank{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:42px;margin-top:14px;opacity:0;transition:opacity .3s}
.i2-rank.on{opacity:1}
.i2-emb .emb{display:block;filter:none}
.i2-emb.pop{animation:i2pop .22s ease-out}
@keyframes i2pop{from{transform:scale(.6)}to{transform:none}}
.i2-tier{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:3px;color:var(--tc,#fff);min-width:130px}
.i2-mark{position:relative;margin-top:22px;font-family:var(--display);font-weight:700;font-size:46px;color:#fff;display:flex;align-items:center}
.i2-mark .dot{width:16px;height:16px;border-radius:50%;background:var(--red);margin-right:10px;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.i2-mark .l{display:inline-block;opacity:0;transform:translateY(16px);transition:opacity .35s ease, transform .5s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i) * 35ms)}
#intro.v2.brand .i2-mark .l{opacity:1;transform:none}
#intro.v2.brand .i2-mark .dot{transform:scale(1)}
.i2-sub{position:relative;margin-top:6px;color:#a9a9ba;font-size:14px;letter-spacing:.5px;opacity:0;transform:translateY(6px);transition:opacity .5s ease .4s, transform .5s ease .4s}
#intro.v2.brand .i2-sub{opacity:1;transform:none}
.i2-tap{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:#6c6c7e;opacity:0;transition:opacity .5s ease 1.2s}
#intro.v2.go .i2-tap{opacity:1}
/* yenilikler + deneme modu */
.wn{list-style:none;margin:6px 0 16px;padding:0;display:grid;gap:10px}
.wn li{display:flex;gap:12px;align-items:flex-start}
.wn-ic{flex:none;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:18px}
.wn b{display:block;color:#fff;font-size:15px}
.wn small{display:block;color:#a9a9ba;font-size:13px;line-height:1.35}
.demo-bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4px);left:50%;transform:translateX(-50%);z-index:40;width:calc(100% - 20px);max-width:520px;background:#5b3df5;color:#fff;font-size:12px;font-weight:600;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.demo-bar button{margin-left:auto;flex:none;border:0;border-radius:8px;padding:6px 10px;background:#fff;color:#2b1d8f;font-weight:800}
body.demo-on .top{padding-top:52px}
/* ana rank */
.mainrank .mr-top{display:flex;align-items:center;gap:14px}
.mainrank .mr-top small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.mainrank .mr-top b{display:block;font-family:var(--display);font-size:30px;line-height:1.05;color:var(--tc)}
.mainrank .mr-top span{display:block;color:var(--muted);font-size:12px}
.mainrank .bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.mainrank .bar i{display:block;height:100%;background:var(--tc)}
.mr-next{font-size:12px;color:var(--muted);margin:4px 0 0}
.mr-q{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:600}
.cm-none{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#3a3f50;color:#fff;font-weight:800}
.cm-none.big{width:64px;height:64px;font-size:28px}
.char-main{padding:0 12px 10px}
.cm-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--screen-ink)}
.cm-in small{display:block;font-size:10px;color:var(--screen-muted);letter-spacing:.5px}
.cm-in b{font-family:var(--display);font-size:18px;color:var(--tc)}
.cm-q{flex-basis:100%;margin:2px 0 0;font-size:12px;color:var(--screen-muted);font-style:italic}
.i2-tw{display:flex;flex-direction:column;align-items:flex-start}
.i2-tw small{font-size:10px;letter-spacing:2px;color:#8e8ea0;opacity:0;transition:opacity .3s}
.i2-rank.final .i2-tw small{opacity:1}
.i2-rank.final .i2-emb{animation:i2fin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes i2fin{0%{transform:scale(.5)}100%{transform:none}}
.intro-rank{display:flex;align-items:center;gap:10px;margin-top:4px;opacity:0;transform:scale(.7);transition:opacity .3s, transform .45s cubic-bezier(.2,1.6,.4,1)}
.intro-rank.on{opacity:1;transform:none}
.intro-rank small{display:block;font-size:10px;letter-spacing:2px;color:#8e8ea0}
.intro-rank b{font-family:var(--display);font-size:22px;color:var(--tc)}
/* ayarlar */
.settings .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.settings .set-row b,.settings .set-block > b{display:block;font-size:15px}
.settings small{display:block;color:var(--muted);font-size:12px}
.set-block{padding:12px 0;border-bottom:1px solid var(--line)}
.set-block:last-child{border-bottom:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sw{position:relative;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--sw);padding:0;display:grid;place-items:center;cursor:pointer}
.sw i{font-style:normal;font-weight:800;font-size:13px;color:var(--muted)}
.sw.on{outline:3px solid var(--red);outline-offset:2px}
.sw-c{font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-size:18px}
.sw-c input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.set-prev{margin:10px 0;padding:12px;border-radius:12px;background:var(--surface-2)}
.set-prev b,.set-prev span{display:block}
.set-prev span{font-weight:600}
/* hareket menüsü, drop ve süper set */
.item-top{display:flex;align-items:flex-start}
.item-top .item-head{flex:1;min-width:0}
.dots{flex:none;border:0;background:none;color:var(--muted);font-size:22px;font-weight:800;line-height:1;padding:12px 14px 6px;letter-spacing:1px}
.dots.sm{padding:0 4px;font-size:18px;margin-left:4px}
.tagd{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:#7a3cff;color:#fff;font-size:10px;font-weight:800;letter-spacing:.5px}
.sets li.drop em{color:#7a3cff;font-weight:800}
.btn.dropb{background:#7a3cff;color:#fff}
.item.ss{border-left:4px solid #7a3cff}
.item.ss:not(.ss-end){margin-bottom:2px;border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.item.ss:not(.ss-top){border-top-left-radius:4px;border-top-right-radius:4px}
.ss-lbl{padding:8px 14px 0;font-size:12px;font-weight:700;color:#7a3cff}
.menu{display:grid;gap:6px;margin-top:10px}
.menu > button,.menu-row button{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:12px 14px;background:var(--surface-2);font-weight:700;font-size:15px;color:var(--ink)}
.menu small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.menu .danger{color:var(--danger)}
.menu button:disabled{opacity:.45}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.swres{max-height:46vh;overflow:auto}
.ew-res small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.pday li{align-items:center}
.pnotes{margin-top:12px;border-radius:12px;background:var(--surface-2);padding:10px 12px}
.pnotes summary{font-weight:700;cursor:pointer}
.pnotes ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;font-size:13px}
/* nasıl yapılır */
.howto-in{display:flex;gap:14px;align-items:flex-start;margin-top:6px}
.picto-box{flex:none;width:132px;text-align:center;border-radius:14px;background:var(--screen);padding:8px 6px 6px}
.picto-box small{display:block;color:var(--screen-muted);font-size:10px}
.picto{width:120px;height:112px;display:block;margin:0 auto}
.picto .pf line{stroke:#e9ecf3;stroke-width:5;stroke-linecap:round}
.picto .ph{fill:#e9ecf3}
.picto .pw{fill:var(--red)}
.picto .pb{fill:#59607a}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.tips{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px}
.tips ul{margin:6px 0 0;padding-left:18px}
@media (max-width:380px){.howto-in{flex-direction:column;align-items:stretch}.picto-box{width:100%}}
/* beslenme */
.nday{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nday b{font-size:15px}
.nav-b{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:20px;line-height:1;color:var(--ink);padding:0}
.nav-b[disabled]{opacity:.3}
.nut-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.nut-nums{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nut-nums div{background:var(--surface-2);border-radius:10px;padding:7px 9px}
.nut-nums small{display:block;font-size:11px;color:var(--muted)}
.nut-nums b{font-size:15px;font-variant-numeric:tabular-nums}
.nut-nums b.neg{color:#1e8a3a}.nut-nums b.pos{color:#d9822b}
.mb{margin:7px 0}
.mb-t{display:flex;justify-content:space-between;font-size:13px}
.mb-t span{color:var(--muted);font-variant-numeric:tabular-nums}
.mb-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.mb-bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.meal{padding-top:12px;padding-bottom:12px}
.meal-h{display:flex;align-items:center;gap:8px}
.meal-h b{flex:1}
.meal-h span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.fl{list-style:none;margin:8px 0 0;padding:0}
.fl li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.fl li div{flex:1;min-width:0}
.fl li b{display:block;font-size:14px}
.fl li small{color:var(--muted);font-size:11px}
.fl li span{font-weight:700;font-variant-numeric:tabular-nums}
.wk{width:100%;height:auto;display:block;margin-top:6px}
.nutcalc summary{list-style:none;cursor:pointer}
.nutcalc summary::-webkit-details-marker{display:none}
.nutcalc summary .h2::after{content:" ▾";font-size:16px;color:var(--muted)}
.ct{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ct td{padding:6px 2px;border-bottom:1px solid var(--line)}
.ct td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ct tr.tot td{font-size:15px;color:var(--ink)}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sg{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 10px;color:var(--ink)}
.sg b{display:block;font-size:13px}.sg small{color:var(--muted);font-size:11px}
.pm{padding:7px 0;border-top:1px solid var(--line)}
.pm b{display:block;font-size:14px}.pm span{color:var(--muted);font-size:13px}
.seg4{grid-template-columns:repeat(4,1fr)!important}
.fres{max-height:42vh;overflow:auto;margin-top:8px}
.fr{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 2px;color:var(--ink)}
.fr b{display:block;font-size:14px}.fr small{color:var(--muted);font-size:12px}
.famt{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.famt input,.cf input{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:18px;color:var(--ink);width:100%}
.fprev{font-size:14px;margin:4px 0 0}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.cf label:first-child{grid-column:1/-1}
/* antrenman özeti ve kalori */
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-head .h2{margin:0}
.live-k{font-size:13px;color:var(--muted);white-space:nowrap}
.live-k b{color:var(--ink)}
.wk-idle .btn.go{margin-top:10px}
.sum-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.sum-g div{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center}
.sum-g b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.sum-g small{font-size:11px;color:var(--muted)}
.sum-ex{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.sum-ex li{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
/* mitolojik ana rank */
.myth{display:inline-grid;place-items:center;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--tc) 55%,#fff), var(--tc) 55%, color-mix(in srgb,var(--tc) 60%,#000));box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 30%,transparent),0 4px 14px color-mix(in srgb,var(--tc) 45%,transparent)}
.myth svg{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.myth.zeus svg{fill:#fff8c4;stroke:#fff}
.myth.zeus{box-shadow:0 0 0 3px #fff6,0 0 22px var(--tc)}
.mythn{font-style:normal;font-size:.8em;color:var(--tc);margin-left:4px}
.mythn.big{display:block;margin:2px 0 0;font-size:13px;font-weight:600}
.myth-row{display:flex;justify-content:space-between;margin-top:10px}
.myth-s{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,transparent);opacity:.55}
.myth-s svg{fill:none;stroke:var(--tc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.myth-s.on{opacity:1;background:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 35%,transparent)}
.myth-s.on svg{stroke:#fff}
.i2-myth{display:block;font-style:normal;color:#fff;font-size:13px;letter-spacing:2px;opacity:.85}
.intro-rank em{display:block;font-style:normal;font-size:12px;letter-spacing:2px;color:var(--tc)}
#intro.zeus-flash::after{content:"";position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;animation:zflash .7s ease-out}
@keyframes zflash{0%{opacity:0}15%{opacity:.75}100%{opacity:0}}
/* kas sayfası */
.kas-fig{display:flex;justify-content:center;gap:8px;background:var(--screen);border-radius:14px;padding:10px;margin-bottom:12px}
.kas-fig svg{height:220px;width:auto}
.kas-r{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.kas-r small{display:block;font-size:11px;color:var(--muted)}.kas-r b{color:var(--tc);font-size:18px}.kas-r span{display:block;font-size:12px;color:var(--muted)}
.kas h3,.panel h3{font-size:15px;margin:12px 0 4px}
.kas p{margin:0;font-size:14px;line-height:1.45}
.tips{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.tips.bad li::marker{color:#ff5a4f}
.kas-link{margin:8px 0 2px;display:inline-block;text-decoration:none}
/* kompakt başlatma alanı ve sayaç */
.clock{font-size:clamp(24px,8cqi,32px)!important;margin:2px 0 10px!important}
.btn.go{font-size:16px;padding:10px 14px}
.hero .btn.go{font-size:16px;padding:10px 14px}
/* sürükle-bırak */
.drag{flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);font-size:16px;line-height:1;padding:6px 6px 6px 0}
.item-top{display:flex;align-items:flex-start}
.item-top .drag{padding:14px 2px 0 10px}
.pday li{align-items:center}
.pday li .drag{padding:2px 4px 2px 0}
.dragging{position:relative;z-index:6;box-shadow:0 12px 28px rgba(0,0,0,.22);opacity:.97}
.dnd-sib{transition:transform .15s ease}
/* drop set ayarı */
.dropcfg{display:block;text-align:left;border-radius:12px;background:var(--surface-2);padding:12px;margin:0 0 8px}
.dropcfg small{display:block;color:var(--muted);font-size:12px;margin:2px 0 6px}
.dc-row{display:flex;align-items:center;gap:6px;margin:4px 0}
.dc-row span{width:52px;font-size:12px;color:var(--muted)}
.dropcfg .btn.go.sm{margin-top:6px}
/* ayarlar */
.tg{flex:none;width:50px;height:30px;border-radius:999px;border:0;padding:0;background:var(--line);position:relative;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.tg.on{background:#34c759}.tg.on i{transform:translateX(20px)}
.combos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.combo{border:1px solid var(--line);border-radius:12px;background:var(--cb);color:var(--ct);padding:8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.combo i{font-style:normal;font-size:16px}
.cwarn{background:rgba(255,159,67,.15);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.cwarn .btn{margin-top:6px}
.cok{font-size:12px;color:#1e8a3a;margin:6px 0}
.pi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pi label,.pis{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.pi input,.pis select{padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:15px;color:var(--ink);width:100%;min-width:0}
.pis{margin-top:8px}
/* klavye açıkken: karakter paneli, alt menü ve dinlenme çubuğu yer kaplamasın */
body.kb-open .char,body.kb-focus.kb-open .char{display:none!important}
body.kb-open .tabbar,body.kb-open #restbar{display:none!important}
body.kb-open main{padding-bottom:calc(var(--kb,0px) + 40px)}
body.kb-open .sheet{max-height:calc(100vh - var(--kb,0px) - 24px)}
body.kb-open #modal{padding-bottom:calc(var(--kb,0px) + 8px)}
#onb{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px) + var(--kb,0px))}
@media (max-width:700px){ body.kb-focus .char{display:none} }
/* iOS’ta odaklanınca sayfanın yakınlaşmaması için en az 16 px */
.setform input,.rte-in input,.ew-set input,.pi input,.famt input,.cf input,input.search{font-size:16px}
/* ===== rank atlama (yeni) ===== */
.ru{background:#07070c;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 45%,#07070c) 0%,#0a0a12 55%,#050508 100%);overflow:hidden}
.ru .fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ru-rays{position:absolute;left:50%;top:40%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);pointer-events:none;opacity:.32;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tc) 70%,transparent) 0deg 7deg,transparent 7deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 60%);mask:radial-gradient(circle,#000 0%,transparent 60%);animation:ruSpin 22s linear infinite}
.ru.tier .ru-rays{opacity:.5;animation-duration:12s}
@keyframes ruSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ru::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff,transparent 60%);opacity:0;pointer-events:none}
.ru.flash::after{animation:ruFlash .55s ease-out}
.ru.tier.flash::after{animation:ruFlash .8s ease-out}
@keyframes ruFlash{0%{opacity:0}12%{opacity:.55}100%{opacity:0}}
.ru-stage{position:relative;z-index:2;width:100%;display:grid;place-items:center}
.ru-card{animation:none}
.ru-card .ru-k,.ru-card .ru-t,.ru-card .ru-sub,.ru-card .ru-l,.ru-card .ru-bar,.ru-card .ru-meta,.ru-card .ru-go,.ru-card .ru-skip,.ru-card .ru-n{opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.ru-card.in .ru-k{opacity:1;transform:none;transition-delay:.55s}
.ru-card.in .ru-t{opacity:1;transform:none;transition-delay:.65s}
.ru-card.in .ru-sub{opacity:1;transform:none;transition-delay:.7s}
.ru-card.in .ru-l{opacity:1;transform:none;transition-delay:.78s}
.ru-card.in .ru-bar,.ru-card.in .ru-meta{opacity:1;transform:none;transition-delay:.86s}
.ru-card.in .ru-n,.ru-card.in .ru-go,.ru-card.in .ru-skip{opacity:1;transform:none;transition-delay:1s}
.ru-card.still *{opacity:1!important;transform:none!important}
.ru-k{display:block;font-family:var(--display);font-weight:800;letter-spacing:5px;font-size:15px;color:#fff;
  background:linear-gradient(100deg,var(--tc) 20%,#fff 45%,var(--tc) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ruShine 2.4s linear infinite}
@keyframes ruShine{from{background-position:120% 0}to{background-position:-120% 0}}
.ru-emb{position:relative;display:inline-grid;place-items:center;margin:14px 0 8px;opacity:0;transform:scale(2.4);filter:blur(10px) brightness(2);animation:none}
.ru-emb::before{display:none}
.ru-emb>.emb,.ru-e>.emb{width:140px!important;height:140px!important}
.ru-card.in .ru-emb{animation:ruDrop .55s cubic-bezier(.3,1.4,.5,1) .05s forwards}
.ru-card.still .ru-emb{opacity:1;transform:none;filter:none}
@keyframes ruDrop{0%{opacity:0;transform:scale(2.4);filter:blur(10px) brightness(2)}70%{opacity:1;transform:scale(.92);filter:blur(0) brightness(1.4)}100%{opacity:1;transform:scale(1);filter:none}}
.ru-emb>svg,.ru-emb>.myth{position:relative;z-index:1;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--tc) 80%,transparent))}
.ru-emb>.myth svg{filter:none}
.ru-card.in .ru-emb>svg,.ru-card.in .ru-emb>.myth{animation:ruFloat 3s ease-in-out 1.2s infinite}
@keyframes ruFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ru-ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px solid var(--tc);opacity:0;box-shadow:0 0 24px var(--tc)}
.ru-card.in .ru-ring{animation:ruRing2 1s ease-out .42s}
.ru-card.in .ru-ring.r2{animation:ruRing2 1.2s ease-out .58s}
.ru.tier .ru-card.in .ru-ring.r2{border-color:#fff}
@keyframes ruRing2{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.ru-t{font-family:var(--display);font-weight:800;font-size:34px;margin:2px 0 0;line-height:1.05;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.ru-sub{color:#b9b9c9;font-size:13px;margin-top:4px}
.ru-l{margin:10px 0 0;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.ru-l span{color:#9c9cad;text-decoration:line-through;font-size:15px}
.ru-l em{font-style:normal;color:var(--tc)}
.ru-l b{font-family:var(--display);font-size:28px;color:var(--tc);text-shadow:0 0 18px color-mix(in srgb,var(--tc) 60%,transparent)}
.ru-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:14px auto 6px;max-width:260px}
.ru-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 60%,#fff),var(--tc));box-shadow:0 0 12px var(--tc);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ru-meta{display:flex;justify-content:space-between;max-width:260px;margin:0 auto;font-size:13px;color:#b9b9c9}
.ru-meta b{color:#fff;font-variant-numeric:tabular-nums;font-size:15px}
.ru-go{margin-top:12px}
/* ===== sinematik açılış ===== */
#intro.v3{background:#06060b;background:radial-gradient(ellipse at 50% 40%,#1b1b2a 0%,#08080e 62%,#040407 100%);overflow:hidden}
#intro.v3 .fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.i3-rays{position:absolute;left:50%;top:40%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tc,#7fa2ff) 55%,transparent) 0deg 5deg,transparent 5deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 55%);mask:radial-gradient(circle,#000 0%,transparent 55%);transition:opacity 1s ease;animation:ruSpin 30s linear infinite}
#intro.v3.go .i3-rays{opacity:.18}
#intro.v3.final .i3-rays{opacity:.38}
#intro.v3 .i2-fig{position:relative;filter:drop-shadow(0 0 0 transparent);transition:opacity .7s ease,transform 1s cubic-bezier(.2,.8,.2,1),filter .6s}
#intro.v3.final .i2-fig{filter:drop-shadow(0 0 26px color-mix(in srgb,var(--tc) 70%,transparent))}
#intro.v3 .i2-fig .m,#intro.v3 .i2-fig .m2{transition:fill .22s ease}
.i3-scan{position:absolute;left:-10%;right:-10%;top:0;height:18%;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(160,200,255,.35) 45%,rgba(220,235,255,.9) 50%,rgba(160,200,255,.35) 55%,transparent);mix-blend-mode:screen}
#intro.v3.scan .i3-scan{animation:i3scan .95s ease-in-out forwards}
@keyframes i3scan{0%{top:-10%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:95%;opacity:0}}
.i3-shock{position:absolute;left:50%;top:42%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid var(--tc,#fff);opacity:0;box-shadow:0 0 30px var(--tc,#fff);pointer-events:none}
#intro.v3.final .i3-shock{animation:ruRing2 1.1s ease-out}
#intro.v3.final .i3-shock.s2{animation:ruRing2 1.4s ease-out .15s;border-color:#fff}
#intro.v3 .i2-rank.final{animation:i3pop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes i3pop{0%{transform:scale(.7)}100%{transform:none}}
#intro.v3 .i2-tier{text-shadow:0 0 16px color-mix(in srgb,var(--tc) 70%,transparent)}
.i3-word{position:relative;display:inline-flex}
#intro.v3.brand .i3-word{background:linear-gradient(100deg,#fff 30%,#ffd86b 46%,#fff 62%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:ruShine 2.2s ease-in-out .5s 1}
#intro.v3.brand .i3-word .l{-webkit-text-fill-color:currentColor}
#intro.v3 .i2-mark{text-shadow:0 0 30px rgba(255,255,255,.25)}
#intro.v3 .i2-mark .dot{box-shadow:0 0 18px var(--red)}
/* ===== aktif antrenman sayfası ===== */
body[data-tab="aktif"] .char,body[data-tab="aktif"] .tabbar,body[data-tab="aktif"] .top{display:none!important}
body[data-tab="aktif"] main{padding-bottom:40px}
body[data-tab="aktif"] #restbar{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.aw{min-height:calc(100vh - 20px);display:flex;flex-direction:column}
.aw-top{position:sticky;top:0;z-index:7;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 4px 10px;background:var(--bg)}
.aw-min{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--ink);padding:0;flex:none}
.aw-tc{flex:1;min-width:0;text-align:center}
.aw-clock{display:block;font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.aw-tc small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.aw-tc small b{color:var(--ink)}
.aw-fin{flex:none;padding:10px 16px;font-size:15px}
.aw.empty .aw-top .aw-tc{visibility:hidden}
.aw-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 10px;min-height:52vh}
.aw-big{font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,110px);font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.aw-empty p{color:var(--muted);margin:12px 0 0}
.aw-list{display:flex;flex-direction:column}
.aw-add{margin:14px 0 6px;font-size:17px;padding:14px}
.aw-cancel{border:0;background:none;color:#d64545;font-weight:600;padding:12px;margin:0 auto}
.aw-pick{min-height:100vh}
.aw-ph{position:sticky;top:0;z-index:7;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 2px 10px;background:var(--bg)}
.aw-ph b{font-size:18px}.aw-ph span{width:40px}
.aw-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;color:var(--ink);padding:0}
.aw-resume{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--red)}
.aw-resume small{display:block;color:var(--muted);font-size:12px}.aw-resume b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.live{cursor:pointer}
/* ===== kayıt / tanıtım ===== */
#onb{overflow:hidden}
#onb .fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#onb.full{background:#07070d;background:radial-gradient(ellipse at 30% 10%,#1c1f3a 0%,transparent 55%),radial-gradient(ellipse at 80% 90%,#2a1424 0%,transparent 55%),#07070d}
#onb .onb-card{position:relative;z-index:2;animation:onbSlide .42s cubic-bezier(.2,.8,.2,1)}
#onb .onb-card.back{animation:onbSlideB .42s cubic-bezier(.2,.8,.2,1)}
@keyframes onbSlide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes onbSlideB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#onb.full .onb-card{max-width:440px}
.onb-prog{flex:1;height:6px;border-radius:999px;background:rgba(127,127,140,.25);overflow:hidden}
.onb-prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff5a4f,#f5c84a);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.onb-st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#onb.full .onb-st{color:#8e8ea0}
.onb-q{margin-bottom:14px}
.onb-qi{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;font-size:26px;margin-bottom:10px;background:linear-gradient(135deg,rgba(255,90,79,.22),rgba(245,200,74,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.onb-big{font-family:var(--display);font-weight:800;font-size:40px!important;line-height:1.02!important;margin:6px 0 12px!important}
.grad{background:linear-gradient(90deg,#ff5a4f,#f5c84a,#5fd8c0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.onb-figwrap{display:flex;justify-content:center;height:30vh;max-height:240px;margin:-4px 0 6px;filter:drop-shadow(0 10px 30px rgba(120,140,255,.25))}
.onb-figwrap svg{height:100%;width:auto}
.onb-pulse{animation:onbPulse 2.6s ease-in-out infinite}
@keyframes onbPulse{0%,100%{fill:var(--mfill,#9aa0b4)}40%{fill:#ff5a4f}60%{fill:#ff5a4f}}
.onb-feats{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.onb-feats li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;padding:10px 12px;border-radius:14px;background:rgba(127,127,140,.12)}
#onb.full .onb-feats li{background:rgba(255,255,255,.06);color:#e9e9f2}
.onb-feats b{font-size:20px}
.onb-cta{font-size:18px!important;padding:15px!important;box-shadow:0 10px 30px rgba(245,200,74,.28);animation:ctaGlow 2.4s ease-in-out infinite}
@keyframes ctaGlow{0%,100%{box-shadow:0 10px 30px rgba(245,200,74,.22)}50%{box-shadow:0 10px 38px rgba(245,200,74,.48)}}
.onb-opt{display:flex;align-items:center;gap:12px;transition:transform .15s ease,border-color .2s,background .2s}
.onb-opt:active{transform:scale(.98)}
.oo-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:rgba(127,127,140,.14)}
.oo-t{display:block;min-width:0}
.oo-t small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
#onb.full .oo-t small{color:#a9a9ba}
.onb-opt[aria-pressed="true"] .oo-ic{background:var(--red);box-shadow:0 0 16px rgba(229,50,45,.45)}
.onb-days .onb-opt{justify-content:center}
.onb-tog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 2px;color:inherit}
.onb-tog i{flex:none;width:46px;height:28px;border-radius:999px;background:rgba(127,127,140,.35);position:relative;transition:background .2s}
.onb-tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.onb-tog.on i{background:#34c759}.onb-tog.on i::after{transform:translateX(18px)}
.onb-tog b{display:block;font-size:14px}.onb-tog small{display:block;font-size:12px;color:var(--muted)}
#onb.full .onb-tog small{color:#a9a9ba}
.onb-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wdb{aspect-ratio:1/1.15;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:800;font-size:13px;padding:0;transition:all .18s}
#onb.full .wdb{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}
.wdb[aria-pressed="true"]{background:linear-gradient(160deg,#ff5a4f,#e5322d)!important;border-color:transparent!important;color:#fff!important;transform:translateY(-2px);box-shadow:0 8px 18px rgba(229,50,45,.4)}
.onb-hint{font-size:13px;margin:10px 0 4px!important;color:#7ee29a!important}
.onb-hint.bad{color:#ff8a80!important}
.onb-lbl{font-size:13px!important;font-weight:700;margin:16px 0 8px!important;color:inherit!important;opacity:.85}
.onb-body .btn.go[disabled]{opacity:.35;pointer-events:none}
.onb-progs{display:grid;gap:10px}
.pcard{text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:18px;padding:14px;color:var(--ink);transition:all .2s;position:relative}
#onb.full .pcard{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:#fff}
.pcard[aria-pressed="true"]{border-color:#f5c84a!important;background:linear-gradient(160deg,rgba(245,200,74,.16),rgba(255,90,79,.08))!important;box-shadow:0 10px 26px rgba(245,200,74,.16)}
.pc-h{display:flex;align-items:center;gap:10px}
.pc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(127,127,140,.16);flex:none}
.pc-h b{display:block;font-size:16px}.pc-h small{display:block;font-size:12px;color:#f5c84a;font-weight:700}
.pc-h em{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;background:#34c759;color:#fff;border-radius:999px;padding:3px 8px}
.pcard p{font-size:13px!important;margin:8px 0!important;color:var(--muted)!important}
#onb.full .pcard p{color:#b4b4c4!important}
.pc-days{display:flex;flex-wrap:wrap;gap:5px}
.pc-days span{font-size:11.5px;font-weight:600;border-radius:8px;padding:4px 7px;background:rgba(127,127,140,.16)}
.pc-days i{font-style:normal;color:#f5c84a;margin-right:4px}
.onb-done{text-align:center;padding-top:6vh}
.od-badge{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:48px;font-weight:900;color:#fff;background:linear-gradient(160deg,#34c759,#1e8a3a);box-shadow:0 0 0 10px rgba(52,199,89,.15),0 18px 40px rgba(52,199,89,.35);animation:i3pop .6s cubic-bezier(.3,1.6,.5,1)}
.od-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.od-sum div{border-radius:14px;padding:10px;background:rgba(127,127,140,.12)}
#onb.full .od-sum div{background:rgba(255,255,255,.06)}
.od-sum small{display:block;font-size:11px;color:var(--muted)}#onb.full .od-sum small{color:#a9a9ba}
.od-sum b{font-size:15px}
.prest{margin-top:4px!important}
/* ===== seviyeye özel rank atlama görünümleri ===== */
.ru.t0 .ru-rays{opacity:.18;animation-duration:40s}
.ru.t0{background:radial-gradient(circle at 50% 40%,#5a3418 0%,#160d07 60%,#070403 100%)}
.ru.t1{background:radial-gradient(circle at 50% 40%,#5e3d2c 0%,#160e0a 60%,#070504 100%)}
.ru.t2 .ru-rays{opacity:.28;background:repeating-conic-gradient(from 0deg,rgba(220,232,250,.55) 0deg 3deg,transparent 3deg 15deg)}
.ru.t3 .ru-rays{opacity:.45}
.ru.t3{background:radial-gradient(circle at 50% 40%,#6b5212 0%,#1a1404 60%,#080602 100%)}
.ru.t4 .ru-emb::after,.ru.t5 .ru-emb::after{content:"";position:absolute;inset:-34px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--tc) 70%,transparent);animation:ruSpin2 9s linear infinite;opacity:.7}
.ru.t5 .ru-emb::after{border-style:dotted;inset:-40px;animation-duration:6s}
@keyframes ruSpin2{to{transform:rotate(360deg)}}
